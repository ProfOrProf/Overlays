<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:"Segoe UI",Verdana,sans-serif; user-select:none;

  #tp-move.live { opacity:1; }
  .tp-knob { position:absolute; left:50%; top:50%; width:calc(var(--u) * 10); height:calc(var(--u) * 10); border-radius:50%; transform:translate(-50%,-50%);

            margin:0 calc(var(--d) / -2) calc(var(--d) / -2) 0; width:var(--d); height:var(--d); font-size:calc(var(--d) * var(--f, .2));

  .tp-roll   { --x:32; --y:28; background:#ff5c5c; }
  .tp-kick   { --x:14; --y:35; background:#58c04c; }
  .tp-fire   { --x:50; --y:22; background:#ff7b00; }

  .tp-btn.pause { position:relative; right:auto; bottom:auto; z-index:1; display:none; flex:0 0 auto; margin:0; --d:max(40px, calc(var(--u) * 10)); border-radius:calc(var(--d) * .26);

  #bossbar.twins #bbtrack2 { display:block; height:calc(var(--h) * 16); border:max(2px, calc(var(--h) * 3)) solid #000; border-radius:calc(var(--h) * 6); background:rgba(10,4,8,.72); overflow:hidden; }

             height:calc(var(--h) * 12); margin-top:calc(var(--h) * 8); border:max(2px, calc(var(--h) * 3)) solid #000; border-radius:calc(var(--h) * 8); background:rgba(10,8,20,.6); }
