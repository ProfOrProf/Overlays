const id = parseInt(new URLSearchParams(location.search).get("seed") || location.hash.replace("#", ""), 10);
const card = document.getElementById("card");
const open = document.getElementById("open");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"}[c]));
const row = (label, value, cls) => value ? `<div class="lbl">${label}</div><div class="val ${cls || ""}">${value}</div>` : "";
const s = SEEDS[id];
if (!s) {
  card.innerHTML = `<p class="missing">No such seed, dude.</p>`;
  open.style.display = "none";
} else {
  const [lord, exp, set, n1, n2, c1, c2, spawn, event, castle, roof, base] = s.map(esc);
  document.title = `${lord} / ${set} / Seed #${id} - TinyKelpReign`;
  const castleLines = [castle, roof && `<span class="dim">Rooftop:</span> ${roof}`, base && `<span class="dim">Basement:</span> ${base}`].filter(Boolean).join("<br>");
  card.innerHTML = `<div class="lord">${lord} / ${exp}</div><div class="seed">Seed #${id}</div><div class="set">${set}</div>`

    + row("Circles", [c1 && `<span class="c1">1. ${c1}</span>`, c2 && `<span class="c2">2. ${c2}</span>`].filter(Boolean).join("<br>"))
    + row("Spawn", spawn) + row("Event", event) + row("Castle", castleLines);
  open.href = `tinykelpreign://seed/${id}`;
  setTimeout(() => { location.href = open.href; }, 500);
}
