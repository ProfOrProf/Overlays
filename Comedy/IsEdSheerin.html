<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Is Ed Sheerin'?</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;background:#12100e;color:#f5efe6;font:16px/1.5 "Segoe UI",system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;padding:48px 20px 80px;transition:background .6s ease;}
  body.yes{background:#2a0a08;}
  body.no{background:#0a1f12;}
  body.maybe{background:#261904;}

  .halo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #ff8c3c;
       box-shadow:0 6px 24px rgba(255,140,60,.35);user-select:none;background:#241f19;}
  .haloemoji{font-size:76px;line-height:120px;display:none;}
  h1{font-size:56px;letter-spacing:-1px;margin:14px 0 4px;text-align:center;}
  h1 .ed{color:#ff8c3c;}
  .disclaimer{color:#b8ab97;font-size:15px;margin-bottom:34px;text-align:center;}

  .searchwrap{width:min(560px,100%);position:relative;}
  input[type=search]{width:100%;padding:18px 22px;font-size:20px;border-radius:14px;border:2px solid #3a332a;
       background:#1d1a16;color:#f5efe6;outline:none;transition:border .2s;}
  input[type=search]:focus{border-color:#ff8c3c;}
  input::placeholder{color:#6e6455;font-style:italic;}
  button.go{position:absolute;right:8px;top:8px;bottom:8px;padding:0 22px;border:none;border-radius:9px;
       background:#ff8c3c;color:#221204;font-size:17px;font-weight:800;cursor:pointer;}
  button.go:hover{background:#ffa25e;}

  .verdict{width:min(560px,100%);margin-top:26px;border-radius:18px;padding:30px 28px;text-align:center;
       display:none;animation:pop .25s ease;}
  @keyframes pop{0%{transform:scale(.92);opacity:0;}100%{transform:scale(1);opacity:1;}}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}
       60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
  .verdict.show{display:block;}
  .verdict.v-yes{background:#3d0f0b;border:2px solid #e0492e;animation:pop .25s ease,shake .45s ease .15s;}
  .verdict.v-no{background:#0f2e1b;border:2px solid #2ea45e;}
  .verdict.v-maybe{background:#3a2a08;border:2px solid #d99b2b;}
  .verdict .big{font-size:42px;font-weight:900;letter-spacing:1px;}
  .v-yes .big{color:#ff6647;}
  .v-no .big{color:#4ade80;}
  .v-maybe .big{color:#f5b942;}
  .verdict .film{font-size:20px;color:#f5efe6;margin-top:6px;font-weight:700;}
  .verdict .detail{color:#cfc4b2;margin-top:12px;font-size:17px;}
  .verdict .detail i{color:#ffb27a;font-style:italic;}
  .meter{margin:18px auto 0;width:min(360px,90%);}
  .meter .lab{font-size:11px;letter-spacing:3px;color:#b8ab97;text-transform:uppercase;margin-bottom:6px;}
  .meter .bar{height:14px;border-radius:7px;background:#241f19;overflow:hidden;}
  .meter .fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#f5b942,#ff8c3c,#e0492e);
       width:0;transition:width .8s cubic-bezier(.2,.8,.3,1);}
  .escape{margin-top:14px;font-size:14px;color:#b8ab97;}
  .escape b{color:#f5efe6;}

  .infected{width:min(560px,100%);margin-top:44px;}
  .infected h2{font-size:14px;letter-spacing:3px;color:#b8ab97;text-transform:uppercase;margin-bottom:12px;text-align:center;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .chip{background:#241f19;border:1px solid #3a332a;color:#e8dfd0;border-radius:999px;padding:7px 14px;
       font-size:14px;cursor:pointer;transition:all .15s;}
  .chip:hover{border-color:#ff8c3c;color:#ff8c3c;}
  .chip .lvl{color:#ff8c3c;font-weight:700;margin-left:6px;}

  .albums{margin-top:52px;color:#6e6455;font-size:26px;letter-spacing:18px;padding-left:18px;}

  .bits{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
  .bit{position:absolute;top:-24px;width:10px;height:14px;background:#ff8c3c;opacity:.9;border-radius:2px;
       animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.7;}}
</style>
</head>
<body>

<img class="halo" alt="Ed Sheeran"
     src="https://commons.wikimedia.org/wiki/Special:FilePath/Ed%20Sheeran-6886%20(cropped).jpg?width=480"
     onerror="this.style.display='none';document.getElementById('haloemoji').style.display='block';">
<div class="haloemoji" id="haloemoji">👨‍🦰🎸</div>
<h1>Is <span class="ed">Ed</span> Sheerin'?</h1>
<div class="disclaimer">No judgment. Some viewers simply need to brace themselves.</div>

<div class="searchwrap">
  <input type="search" id="q" list="films" placeholder="Thinking Out Loud…" autocomplete="off">
  <datalist id="films"></datalist>
  <button class="go" id="go">Dive</button>
</div>

<div class="verdict" id="verdict">
  <div class="big" id="vbig"></div>
  <div class="film" id="vfilm"></div>
  <div class="detail" id="vdetail"></div>
  <div class="meter" id="vmeter" style="display:none">
    <div class="lab">Shivers</div>
    <div class="bar"><div class="fill" id="vfill"></div></div>
  </div>
  <div class="escape" id="vescape"></div>
</div>

<div class="infected">
  <h2>Photograph — the evidence</h2>
  <div class="chips" id="chips"></div>
</div>

<div class="albums">+ × ÷ = −</div>

<div class="bits" id="bits"></div>

<script>
(function(){
'use strict';

var DB=[
  {t:"Yesterday",y:2019,lvl:96,detail:"<i>Shape of You</i> — the film's, entirely his.",escape:"Save Myself: impossible. He is load-bearing.",aka:["yesterday"]},
  {t:"Game of Thrones (S7E1)",y:2017,lvl:88,detail:"<i>Galway Girl</i>, but in Westeros, by a campfire.",escape:"Save Myself: skip the cold open. You'll hear it before you see it.",aka:["game of thrones","got","thrones"]},
  {t:"Red Notice",y:2021,lvl:44,detail:"<i>Bad Habits</i> — fighting federal agents at a wedding.",escape:"Save Myself: when the wedding starts, look away.",aka:["red notice"]},
  {t:"Bridget Jones's Baby",y:2016,lvl:38,detail:"<i>New Man</i>. She doesn't recognize him. Twice.",escape:"Save Myself: brief. A polite amount.",aka:["bridget jones","bridget jones's baby","bridget joness baby","bridget jones baby"]},
  {t:"Sumotherhood",y:2023,lvl:35,detail:"<i>Visiting Hours</i> — as a hospital patient. He commits.",escape:"Save Myself: blink-adjacent. He still sings.",aka:["sumotherhood"]},
  {t:"The Simpsons (Haw-Haw Land)",y:2017,lvl:30,detail:"<i>Lego House</i> — animated, romancing Lisa as 'Brendan'.",escape:"Save Myself: one episode. Milhouse never escapes.",aka:["the simpsons","simpsons"]},
  {t:"Home and Away",y:2015,lvl:26,detail:"<i>Castle on the Hill</i>, if the castle were Summer Bay.",escape:"Save Myself: one scene. G'day, Ed.",aka:["home and away"]},
  {t:"Shortland Street",y:2014,lvl:24,detail:"<i>Visiting Hours</i> (again). New Zealand this time.",escape:"Save Myself: brief and clinically administered.",aka:["shortland street"]},
  {t:"Star Wars: The Rise of Skywalker",y:2019,lvl:15,maybe:true,detail:"<i>Eraser</i> — if he's under that stormtrooper helmet, it worked.",escape:"Save Myself: you'd never know. That's the scary part.",aka:["star wars","rise of skywalker","the rise of skywalker","episode 9","episode ix"]}
];

var SAFE=["Happier.","Life Goes On.","Antisocial.","Celestial.","Afterglow.","Tenerife Sea.","Eyes Closed."];

var q=document.getElementById('q'), verdict=document.getElementById('verdict'),
    vbig=document.getElementById('vbig'), vfilm=document.getElementById('vfilm'),
    vdetail=document.getElementById('vdetail'), vmeter=document.getElementById('vmeter'),
    vfill=document.getElementById('vfill'), vescape=document.getElementById('vescape'),
    bits=document.getElementById('bits');

var dl=document.getElementById('films');
DB.forEach(function(f){ var o=document.createElement('option'); o.value=f.t; dl.appendChild(o); });

var chips=document.getElementById('chips');
DB.forEach(function(f){
  var c=document.createElement('button');
  c.className='chip';
  c.innerHTML=f.t+' <span class="lvl">'+f.lvl+(f.maybe?'?':'')+'</span>';
  c.onclick=function(){ q.value=f.t; check(); };
  chips.appendChild(c);
});

function norm(s){ return s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim(); }

function find(query){
  var n=norm(query);
  if(!n) return null;
  for(var i=0;i<DB.length;i++){
    var f=DB[i], names=[norm(f.t)].concat(f.aka.map(norm));
    for(var j=0;j<names.length;j++){
      if(names[j]===n||names[j].indexOf(n)>=0&&n.length>3||n.indexOf(names[j])>=0) return f;
    }
  }
  return null;
}

function rain(){
  bits.innerHTML='';
  for(var i=0;i<36;i++){
    var b=document.createElement('div');
    b.className='bit';
    b.style.left=(Math.random()*100)+'vw';
    b.style.animationDuration=(1.6+Math.random()*1.8)+'s';
    b.style.animationDelay=(Math.random()*0.6)+'s';
    b.style.background=['#ff8c3c','#e0492e','#f5b942'][i%3];
    bits.appendChild(b);
  }
  setTimeout(function(){ bits.innerHTML=''; },4200);
}

function check(){
  var query=q.value;
  if(!norm(query)) return;
  var f=find(query);
  verdict.className='verdict show';
  document.body.className='';
  vmeter.style.display='none';
  vescape.textContent='';

  if(f&&f.maybe){
    verdict.classList.add('v-maybe');
    document.body.classList.add('maybe');
    vbig.textContent='WHAT DO I KNOW?';
    vfilm.textContent=f.t+' ('+f.y+')';
    vdetail.innerHTML=f.detail;
    vmeter.style.display='block';
    vfill.style.width='0';
    setTimeout(function(){ vfill.style.width=f.lvl+'%'; },40);
    vescape.innerHTML=f.escape.replace('Save Myself:','<b>Save Myself:</b>');
  } else if(f){
    verdict.classList.add('v-yes');
    document.body.classList.add('yes');
    vbig.textContent='🚨 I SEE FIRE.';
    vfilm.textContent=f.t+' ('+f.y+')';
    vdetail.innerHTML=f.detail;
    vmeter.style.display='block';
    vfill.style.width='0';
    setTimeout(function(){ vfill.style.width=f.lvl+'%'; },40);
    vescape.innerHTML=f.escape.replace('Save Myself:','<b>Save Myself:</b>');
    rain();
  } else {
    verdict.classList.add('v-no');
    document.body.classList.add('no');
    vbig.textContent='✅ LIFE GOES ON.';
    vfilm.textContent='"'+query.trim()+'"';
    vdetail.textContent=SAFE[Math.floor(Math.random()*SAFE.length)];
  }
}

document.getElementById('go').onclick=check;
q.addEventListener('keydown',function(e){ if(e.key==='Enter') check(); });
q.addEventListener('input',function(){
  if(DB.some(function(f){ return f.t===q.value; })) check();
});
})();
</script>
</body>
</html>
