<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Wikiprofia – Employee Archive</title>
  <meta name="description" content="The free encyclopedia of ProfCo employees." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Wikiprofia" />
  <meta property="og:title" content="Wikiprofia – Employee Archive" />
  <meta property="og:description" content="The free encyclopedia of ProfCo employees." />
  <meta property="og:url" content="https://proforprof.com/wikiprofia/" />
  <meta property="og:image" content="https://proforprof.com/profify/profco.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Wikiprofia – Employee Archive" />
  <meta name="twitter:description" content="The free encyclopedia of ProfCo employees." />
  <meta name="twitter:image" content="https://proforprof.com/profify/profco.png" />
  <link rel="preload" href="/wikiprofia/manifest.json" as="fetch" crossorigin="anonymous" />
  <script src="/wikiprofia/search.js" defer></script>
  <style>
    :root { --ink:#202122; --rule:#a2a9b1; --blue:#0645ad; --muted:#666; --twitch:#9146FF; }
    * { box-sizing: border-box; }
    body{
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background:#f9f9f9; color:var(--ink);
      max-width: 1000px; margin: 2rem auto; padding: 1rem; line-height:1.6;
    }
    header h1{ margin:0 0 .25rem 0 }
    header .muted{ color:var(--muted); margin-bottom:1rem }
    a{ color:var(--blue); text-decoration:none }
    a:hover{ text-decoration:underline }

    /* search */
    .search{
      position: sticky; top: 0;
      background:#f9f9f9; padding:.75rem 0;
      border-bottom:1px solid #e1e1e1; z-index: 10;
    }
    .search input{
      width: 100%; padding:.7rem 1rem;
      border:1px solid var(--rule); border-radius:10px; font-size:1rem;
    }
    .results{ margin-top:.5rem }
    .result{ padding:.6rem 0; border-bottom:1px solid #e9e9e9 }
    .result a.title{ font-weight:600 }
    .snippet{ color:#444; margin-top:.25rem }

    /* grid cards */
    .grid{
      display:grid; gap:12px; margin-top:1rem;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }
    .card{
      display:flex; gap:12px; align-items:flex-start;
      border:1px solid #e1e1e1; border-radius:12px; background:#fff; padding:12px;
    }
    .avatar{
      width:64px; height:64px; flex:0 0 64px;
      border-radius:9999px; object-fit:cover; border:1px solid #ddd; background:#fafafa;
    }
    .meta{ flex:1 1 auto; min-width:0 }
    .t{ display:block; font-weight:700; line-height:1.25; margin:2px 0; overflow-wrap:anywhere }
    .desc{ color:#555; font-size:.95rem; overflow-wrap:anywhere }

    /* actions */
    .actions{ margin-top:.5rem; display:flex; gap:.5rem; flex-wrap:wrap }
    .btn{ max-width:100%; overflow-wrap:anywhere;
      display:inline-block; padding:.4rem .7rem; border-radius:8px;
      border:1px solid var(--twitch); background:#fff; color:var(--twitch);
      font-weight:600; font-size:.9rem; line-height:1; text-decoration:none;
      transition:background .15s, color .15s;
    }
    .btn:hover{ background:var(--twitch); color:#fff; text-decoration:none }

    .notice{ margin-top:1rem; padding:.75rem 1rem; border:1px solid #e9e9e9; border-radius:8px; background:#fff; color:#444 }
    footer{
      font-size:.9rem; color:#555;
      margin-top:2rem; border-top:1px solid #ddd; padding-top:1rem;
    }
  </style>
</head>
<body>

<header>
  <h1>Wikiprofia</h1>
  <div class="muted">The free encyclopedia of ProfCo employees. <span id="headcount"></span></div>
</header>
<div class="search">
  <input id="wikia-search-input" type="search"
         placeholder="Search employees by name, handle, or what they do…" />
  <div id="wikia-search-results" class="results" hidden></div>
</div>

<h2>Employees</h2>
<div id="runner-grid" class="grid"></div>
<div id="runner-status" class="notice" hidden></div>

<footer>
  Made with ❤️ by <a href="https://proforprof.com">ProfOrProf</a>. Not affiliated with Wikipedia or Twitch.
</footer>
<script>
  const MANIFEST_URL = '/wikiprofia/manifest.json';
  const FALLBACK_AVATAR = 'https://proforprof.com/profify/Profco.png';

  function showStatus(msg) {
    const box = document.getElementById('runner-status');
    box.textContent = msg;
    box.hidden = false;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  (async function loadAndRender() {
    try {
      const res = await fetch(MANIFEST_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('Manifest fetch failed (' + res.status + ')');
      const data = await res.json();
      const runners = (data && data.runners) || [];
      if (!runners.length) { showStatus('No employees found. Check manifest.json.'); return; }

      const grid = document.getElementById('runner-grid');
      const frag = document.createDocumentFragment();

      for (const r of runners) {
        const handle = (r.twitch || '').trim().toLowerCase();
        const card = document.createElement('div');
        card.className = 'card';

        const img = document.createElement('img');
        img.className = 'avatar';
        img.width = 64; img.height = 64;
        img.loading = 'lazy';
        img.decoding = 'async';
        img.alt = r.title + ' avatar';
        img.referrerPolicy = 'no-referrer';
        img.src = (r.avatar || '').trim() || FALLBACK_AVATAR;
        img.onerror = () => { img.onerror = null; img.src = FALLBACK_AVATAR; };

        const meta = document.createElement('div');
        meta.className = 'meta';
        const article = r.page
          ? '<a class="t" href="' + esc(r.url) + '">' + esc(r.title) + '</a>'
          : '<a class="t" href="https://www.twitch.tv/' + esc(handle) + '">' + esc(r.title) + '</a>';
        const desc = '<div class="desc">' + (r.description ? esc(r.description) : '<i>No article yet.</i>') + '</div>';
        const acts = '<div class="actions">'
          + '<a class="btn" href="https://www.twitch.tv/' + esc(handle) + '" target="_blank" rel="noopener noreferrer">Twitch</a>'
          + (r.page ? '<a class="btn" href="' + esc(r.url) + '">Read article</a>' : '')
          + (r.site ? '<a class="btn" href="' + esc(r.site) + '" target="_blank" rel="noopener noreferrer">Personal Site</a>' : '')
          + (r.email ? '<a class="btn" href="mailto:' + esc(r.email) + '">Email</a>' : '')
          + '</div>';
        meta.innerHTML = article + desc + acts;

        card.appendChild(img);
        card.appendChild(meta);
        frag.appendChild(card);
      }
      grid.appendChild(frag);

      const hc = document.getElementById('headcount');
      const withArticles = runners.filter(r => r.page).length;
      if (hc) hc.textContent = runners.length + ' on the payroll, ' + withArticles + ' with articles.';
    } catch (err) {
      console.error(err);
      showStatus('Could not load employees. Open Console for details.');
    }
  })();

  window.addEventListener('DOMContentLoaded', () => {
    if (window.initWikiprofiaSearch) window.initWikiprofiaSearch();
  });
</script>

</body>
</html>
