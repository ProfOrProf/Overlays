<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auto Hit Counter Overlay</title>
<style>
@font-face{font-family:"SourGummy";src:url("SourGummy-Light.ttf") format("truetype");font-display:block}
:root{
  --w:520px;
  --stage-h:300px;
  --ink:#ffe9ff; --dim:#d9a8e8;
  --clean:#9af0b8; --pace:#ffd23a; --behind:#ff5c8a;
  --state:var(--clean);
  --bar-bg:rgba(255,172,255,.14);
  --gummy:"SourGummy","Trebuchet MS",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;overflow:hidden;font-family:var(--gummy);color:var(--ink);letter-spacing:.04em;text-transform:uppercase}
#stage{position:relative;width:var(--w);height:var(--stage-h)}
#overlay{position:absolute;left:0;right:0;top:calc((var(--stage-h) - 118px) / 2);
  display:grid;row-gap:4px;padding:6px 8px 0}
#flash{position:absolute;left:0;right:0;top:-44px;bottom:-44px;z-index:0;
  background:radial-gradient(closest-side ellipse at 50% 50%,rgba(255,60,96,.52),rgba(255,30,70,.2) 55%,rgba(255,30,70,0) 100%);
  opacity:0;pointer-events:none}
#flash.pop{animation:redflash .45s ease-out}
@keyframes redflash{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
#overlay > *:not(#flash){position:relative;z-index:1}
#title{display:grid;justify-items:center;align-items:center;min-height:40px;margin:2px 0 6px}
#gname{font-size:26px;line-height:1.05;text-align:center;white-space:nowrap;color:var(--ink);
  font-family:"Palatino Linotype",Palatino,Georgia,serif;text-shadow:0 0 18px rgba(255,172,255,.35)}
.main{display:grid;grid-template-columns:1fr calc(var(--w) * .58) 1fr;align-items:center;column-gap:8px}
.stat{display:grid;justify-items:center;line-height:1}
.main .stat:first-child{justify-self:start;margin-left:6px}
.main .stat:last-child{justify-self:end;margin-right:5px}
.stat .v{font-size:30px;font-variant-numeric:tabular-nums}
.stat .l{font-size:14px;color:var(--dim);letter-spacing:.12em;margin-top:3px}
#total{color:var(--state)}
.centre{display:grid;justify-items:center;min-width:0}
#name{font-size:40px;line-height:1;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#name.hit{color:var(--behind)}
#igt{font-size:16px;color:var(--dim);letter-spacing:.08em;font-variant-numeric:tabular-nums;margin-top:2px}
#bar{height:8px;margin-top:2px;background:var(--bar-bg);position:relative;border-radius:4px}
#fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--state);transition:width .25s ease,background .25s ease;border-radius:4px}
#marks{position:absolute;inset:-3px 0;pointer-events:none}
#marks i{position:absolute;top:0;bottom:0;width:5px;margin-left:-2.5px;border-radius:2px;
  background:#b3202f;box-shadow:0 0 6px rgba(179,32,47,.8)}
#overlay.complete #name{color:var(--state)}
#overlay.struck{animation:knock .4s ease-out}
@keyframes knock{
  0%{transform:translate(0,0) rotate(0)}
  12%{transform:translate(-13px,3px) rotate(-1.2deg)}
  34%{transform:translate(7px,-2px) rotate(.7deg)}
  58%{transform:translate(-4px,1px) rotate(-.3deg)}
  100%{transform:translate(0,0) rotate(0)}
}
#paw{position:absolute;z-index:3;width:300px;right:-34px;top:calc((var(--stage-h) - 188px) / 2);
  display:none;pointer-events:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
#paw.swiping{display:block}
.flash{animation:flash .35s ease-out}
@keyframes flash{from{filter:brightness(2.2)}to{filter:brightness(1)}}
#games{position:absolute;left:0;right:0;top:calc((var(--stage-h) - 118px) / 2 - 46px);display:flex;justify-content:center;align-items:center;gap:29px;height:26px;z-index:2;padding:0 8px;transform:translateX(8.02px)}
#games .cell{display:flex}
#games .g{height:22px;background:#9a9a9a;opacity:.41;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;transition:background .35s,opacity .35s}
#games .g.run{background:#ffffff;opacity:1}
#games .g.done{background:var(--clean);opacity:1}
#glogo{display:none;height:40px;max-width:78%;object-fit:contain;filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
#glogo.on{display:block}
#glogo.on + #gname{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="overlay">
    <div id="flash"></div>
    <div id="title"><img id="glogo" alt=""><div id="gname"></div></div>
    <div class="main">
      <div class="stat"><span class="v" id="progress">0/0</span><span class="l">SPLIT</span></div>
      <div class="centre"><span id="name"></span><span id="igt">0:00:00</span></div>
      <div class="stat"><span class="v" id="total">0</span><span class="l">HITS</span></div>
    </div>
      <div id="bar"><div id="fill"></div><div id="marks"></div></div>
  </div>
  <div id="games">
    <div class="cell"><div class="g" data-game="Elden Ring" style="--logo:url(logos/tag_er.png);width:39.19px"></div></div>
    <div class="cell"><div class="g" data-game="Sekiro" style="--logo:url(logos/tag_sk.png);width:36.21px"></div></div>
    <div class="cell"><div class="g" data-game="Dark Souls III" style="--logo:url(logos/tag_ds3.png);width:52.71px"></div></div>
    <div class="cell"><div class="g" data-game="Bloodborne" style="--logo:url(logos/tag_bb.png);width:37.12px"></div></div>
    <div class="cell"><div class="g" data-game="Dark Souls II" style="--logo:url(logos/tag_ds2.png);width:54.31px"></div></div>
  </div>
  <img id="paw" src="scratch.gif" alt="">
</div>
<script>
(function(){
  var WS_URL='ws://localhost:16200', RETRY=3000;
  var SWIPE_MS=700, IMPACT_MS=500;
  var cfg={showIgt:true,titleText:'',runCompleteText:'RUN COMPLETE'};
  var root=document.documentElement, overlay=document.getElementById('overlay');
  var el={igt:document.getElementById('igt'),title:document.getElementById('title'),total:document.getElementById('total'),
          progress:document.getElementById('progress'),name:document.getElementById('name'),fill:document.getElementById('fill'),
          paw:document.getElementById('paw'),flash:document.getElementById('flash'),
          marks:document.getElementById('marks')};
  var lastTotal=-1, pawTimer=null, impactTimer=null;

  var params=new URLSearchParams(location.search);
  var volume=Math.max(0, Math.min(1, parseFloat(params.get('vol'))||0.85));
  var hiss=new Audio('hiss.mp3'), slap=new Audio('slap.mp3');
  hiss.preload='auto'; slap.preload='auto';
  hiss.volume=volume; slap.volume=volume;

  function play(a){ try{ a.currentTime=0; var p=a.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){} }

  function swipe(){
    clearTimeout(pawTimer); clearTimeout(impactTimer);
    el.paw.classList.remove('swiping');
    el.paw.src='scratch.gif?t='+Date.now();
    void el.paw.offsetWidth;
    el.paw.classList.add('swiping');
    play(hiss);
    impactTimer=setTimeout(function(){
      play(slap);
      el.flash.classList.remove('pop'); void el.flash.offsetWidth; el.flash.classList.add('pop');
      overlay.classList.remove('struck'); void overlay.offsetWidth; overlay.classList.add('struck');
    }, IMPACT_MS);
    pawTimer=setTimeout(function(){ el.paw.classList.remove('swiping'); }, SWIPE_MS);
  }

  function fmt(t){ return t ? String(t).replace(/^0(\d:)/,'$1') : ''; }

  function pace(children, cur){
    var d=0;
    for(var i=0;i<children.length && i<=cur;i++){ d += (children[i].hits||0) - (children[i].pb||0); }
    return d;
  }

  function marks(children){
    var n=children.length, html='';
    for(var i=0;i<n;i++){
      var h=children[i].hits||0;
      for(var k=0;k<h;k++){
        html+='<i style="left:'+Math.max(0.6,(i/n)*100).toFixed(3)+'%;margin-left:'+(-2.5 - k*7)+'px"></i>';
      }
    }
    el.marks.innerHTML=html;
  }

  function render(s){
    paintGames(s);
    var children=s.splits.filter(function(x){return !x.isParent;});
    var cur=children.findIndex(function(x){return x.isCurrent;});
    var shown=cur>=0?cur:(s.isRunComplete?children.length-1:0);
    var current=children[shown]||{name:'',hits:0};
    var total=s.totalHits||0;
    var colour = total===0 ? 'var(--clean)' : (pace(children, shown)<=0 ? 'var(--pace)' : 'var(--behind)');
    root.style.setProperty('--state', colour);
    el.total.textContent=total;
    var game=s.gameName || s.profileName || '';
    var lg=GAME_LOGOS[game], gl=document.getElementById('glogo');
    document.getElementById('gname').textContent=game;
    if(lg){ if(gl.getAttribute('src')!==lg) gl.src=lg; gl.classList.add('on'); }
    else gl.classList.remove('on');
    el.progress.textContent=(shown+1)+'/'+children.length;
    el.name.textContent=s.isRunComplete ? (cfg.runCompleteText||'RUN COMPLETE') : (current.name||'');
    el.name.classList.toggle('hit',!s.isRunComplete && (current.hits||0)>0);
    el.fill.style.width=(children.length?((s.isRunComplete?children.length:shown)/children.length)*100:0)+'%';
    marks(children);
    overlay.classList.toggle('complete',!!s.isRunComplete);
    if(cfg.showIgt && s.inGameTime) el.igt.textContent=fmt(s.inGameTime);
    el.igt.style.display=cfg.showIgt?'':'none';
    if(lastTotal>=0 && total>lastTotal){
      el.total.classList.remove('flash'); void el.total.offsetWidth; el.total.classList.add('flash');
      swipe();
    }
    lastTotal=total;
  }

  function applyConfig(c){
    if(c.titleText!==undefined) cfg.titleText=c.titleText;
    if(c.showIgt!==undefined) cfg.showIgt=!!c.showIgt;
    if(c.runCompleteText) cfg.runCompleteText=c.runCompleteText;
    if(c.overlayWidth>0) root.style.setProperty('--w', c.overlayWidth+'px');
    if(c.customCss!==undefined){
      var s=document.getElementById('customCss');
      if(!s){ s=document.createElement('style'); s.id='customCss'; document.head.appendChild(s); }
      s.textContent=c.customCss||'';
    }
  }

  var last=null;
  function connect(){
    var ws=new WebSocket(WS_URL);
    ws.onclose=function(){ setTimeout(connect,RETRY); };
    ws.onerror=function(){ ws.close(); };
    ws.onmessage=function(e){
      var m=JSON.parse(e.data);
      if(m.type==='state'){ last=m.data; render(m.data); }
      else if(m.type==='igt'){ if(cfg.showIgt) el.igt.textContent=fmt(m.data); }
      else if(m.type==='config'){ applyConfig(m.data); if(last) render(last); }
    };
  }

  window.addEventListener('keydown',function(e){ if(e.key==='h'||e.key==='H') swipe(); });
  document.addEventListener('click',function(){ swipe(); });


  var GAME_LOGOS={'Elden Ring':'logos/er.png','Sekiro':'logos/sk.png','Dark Souls III':'logos/ds3.png','Bloodborne':'logos/bb.png','Dark Souls II':'logos/ds2.png'};
  Object.keys(GAME_LOGOS).forEach(function(k){ new Image().src=GAME_LOGOS[k]; });
  var RUN_ORDER=['Elden Ring','Sekiro','Dark Souls III','Bloodborne','Dark Souls II'];

  function paintGames(s){
    var game=s.gameName || s.profileName || '';
    var at=RUN_ORDER.indexOf(game);
    var done=(s.done||[]).map(function(x){return String(x);});
    [].forEach.call(document.querySelectorAll('#games .g'),function(g){
      var i=RUN_ORDER.indexOf(g.dataset.game);
      g.classList.remove('run','done');
      if(i<0) return;
      var isDone = done.length ? done.indexOf(g.dataset.game)>=0 : (at>=0 && i<at);
      if(isDone) g.classList.add('done');
      else if(i===at) g.classList.add('run');
    });
  }
  if(params.has('demo')){
    var LEGS=[
      {game:'Elden Ring',     bosses:['Margit','Godrick','Rennala','Radahn','Morgott']},
      {game:'Sekiro',         bosses:['Gyoubu','Lady Butterfly','Genichiro','Guardian Ape','Owl']},
      {game:'Dark Souls III', bosses:['Vordt','Abyss Watchers','Pontiff','Dancer','Soul of Cinder']},
      {game:'Bloodborne',     bosses:['Gascoigne','Vicar Amelia','Rom','The One Reborn','Gehrman']},
      {game:'Dark Souls II',  bosses:['The Pursuer','Ruin Sentinels','Smelter Demon','Looking Glass Knight','Nashandra']}
    ];
    var leg=0;
    function fresh(){
      var L=LEGS[leg % LEGS.length];
      return {profileName:'Dog Run', gameName:L.game, done:LEGS.slice(0, leg % LEGS.length).map(function(x){return x.game;}),
        totalHits:0,isRunComplete:false,inGameTime:'02:41:08',
        splits:L.bosses.map(function(n,i){return {name:n,hits:0,pb:i%3===0?1:0,isCurrent:i===0,isParent:false};})}; }
    var demo=fresh(), step=0, t=9668, held=0;
    render(demo);
    setInterval(function(){
      t++;
      demo.inGameTime=String(Math.floor(t/3600)).padStart(2,'0')+':'+String(Math.floor(t/60)%60).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
      el.igt.textContent=fmt(demo.inGameTime);
      if(demo.isRunComplete){ if(++held>=5){ leg++; demo=fresh(); step=0; held=0; lastTotal=-1; render(demo); } return; }
      if(t%4===0){
        step++;
        var cur=demo.splits.findIndex(function(x){return x.isCurrent;});
        if(step%3===0){ demo.splits[cur].hits++; demo.totalHits++; }
        else if(cur<demo.splits.length-1){ demo.splits[cur].isCurrent=false; demo.splits[cur+1].isCurrent=true; }
        else { demo.isRunComplete=true; }
        render(demo);
      }
    },1000);
  } else {
    connect();
  }
})();
</script>
</body>
</html>
