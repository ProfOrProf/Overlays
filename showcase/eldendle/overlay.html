<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>ELDENDLE</title>
  <style>

    :root {
      --face:        "Agmena", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --gold:        #c9a84c;
      --gold-light:  #f0d080;
      --border:      rgba(201,168,76,0.28);
      --border-faint:rgba(201,168,76,0.10);
      --row-bg:      rgba(30,21,10,0.97);
      --text-bright: #f5e8c0;
      --red-arrow:   #cb6150;
      --green-arrow: #6cc079;
      --row-h:       170px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px; height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: var(--face);
      color: var(--gold);
    }

    #root {
      position: absolute;
      width: 1920px; height: 1080px;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    #root.visible { opacity: 1; }
    #root.hidden  { display: none; }

    #anchor {
      position: absolute;
      left: 160px; top: 16px;
      transform-origin: 0 0;
    }

    #panel {
      width: 1600px;
      position: relative;
      background: rgba(10,8,4,0.84);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0,0,0,0.5);
      transition: box-shadow 0.5s ease;
    }
    #panel.won {
      box-shadow: 0 0 50px rgba(0,0,0,0.5), 0 0 60px rgba(201,168,76,0.5), 0 0 120px rgba(201,168,76,0.12);
    }
    #panel.lost {
      box-shadow: 0 0 50px rgba(0,0,0,0.5), 0 0 70px rgba(200,40,40,0.45);
    }

    #header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 96px;
      padding: 18px 32px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(201,168,76,0.07) 0%, transparent 100%);
    }
    #pip-cluster {
      position: absolute;
      left: 24px; top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    #pip-label {
      font-size: 22px;
      letter-spacing: 3px;
      color: var(--gold-light);
      text-transform: uppercase;
    }
    #pip-row { display: grid; grid-template-columns: repeat(5, auto); gap: 9px; }
    .pip {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 2px solid var(--gold-light);
    }
    .pip.wrong   { background: rgba(200,40,40,0.85); border-color: rgba(220,60,60,0.7); }
    .pip.correct { background: var(--gold); box-shadow: 0 0 7px rgba(201,168,76,0.5); }

    #title-block { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    #title-stars { font-size: 16px; color: var(--gold-light); opacity: 0.65; letter-spacing: 10px; }
    #title {
      font-size: 50px; font-weight: 700; color: var(--gold-light);
      letter-spacing: 8px; text-transform: uppercase; line-height: 1;
      text-shadow: 0 0 22px rgba(201,168,76,0.5), 0 2px 8px rgba(0,0,0,0.9);
    }
    #subtitle { font-size: 26px; color: var(--gold-light); letter-spacing: 3.5px; text-transform: uppercase; }

    #gcount {
      position: absolute; right: 28px; top: 50%;
      transform: translateY(-50%);
      text-align: right;
      font-size: 22px; letter-spacing: 3px;
      color: var(--gold-light); text-transform: uppercase; line-height: 1.1;
    }
    #gcount b { display: block; font-size: 48px; letter-spacing: 1px; font-weight: 700; }

    #window {
      position: relative;
      height: var(--row-h);
      margin: 22px 26px 26px;
      overflow: hidden;
      border: 1px solid rgba(201,168,76,0.32);
      border-radius: 9px;
      background: var(--row-bg);
      box-shadow: inset 0 0 26px rgba(201,168,76,0.035);
    }
    #window::before, #window::after {
      content: ""; position: absolute; left: 0; right: 0; height: 22px; z-index: 2; pointer-events: none;
    }
    #window::before { top: 0;    background: linear-gradient(180deg, rgba(0,0,0,0.55), transparent); }
    #window::after  { bottom: 0; background: linear-gradient(0deg,   rgba(0,0,0,0.55), transparent); }

    #reel { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
    #reel.spinning .row { filter: blur(2.5px); }
    #reel.spinning .row:last-child { filter: none; }

    .row {
      height: var(--row-h);
      display: grid;
      grid-template-columns: 1fr 170px 300px 330px 320px;
      align-items: stretch;
    }
    .row.reveal-row { grid-template-columns: 170px 1fr 300px 330px 320px; }

    .cell {
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 22px;
      border-left: 1px solid var(--border-faint);
      min-width: 0; position: relative;
    }
    .cell:first-child { border-left: none; }

    .lab {
      font-size: 22px; letter-spacing: 0.24em; text-transform: uppercase;
      color: rgba(240,208,128,0.62); line-height: 1; margin-bottom: 10px; white-space: nowrap;
    }
    .val {
      font-weight: 700; color: var(--text-bright);
      line-height: 1.22; padding-bottom: 0.08em;
      white-space: nowrap; display: flex; align-items: center; gap: 14px;
      overflow: hidden; text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }
    .val .arrow { font-size: 0.72em; flex: none; }
    .hi .arrow, .lo .arrow { color: var(--red-arrow); }
    .ok { box-shadow: inset 0 0 14px rgba(201,168,76,0.14); }
    .ok .val, .ok .arrow { color: var(--green-arrow); }
    .no .val { color: var(--red-arrow); }

    .face {
      width: 140px; height: 140px;
      object-fit: cover; object-position: center top;
      border: 1px solid rgba(201,168,76,0.4);
      box-shadow: 0 0 20px rgba(201,168,76,0.18);
      align-self: center;
    }
    .placeholder {
      width: 140px; height: 140px;
      display: flex; align-items: center; justify-content: center;
      font-size: 90px; color: rgba(201,168,76,0.35);
      border: 1px solid rgba(201,168,76,0.4);
      align-self: center;
    }
    .nameval { color: var(--gold-light); text-shadow: 0 0 22px rgba(201,168,76,0.6), 0 2px 6px #000; }
    .stamp {
      font-size: 22px; letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--gold); margin-top: 12px; white-space: nowrap;
    }
    .lost .stamp { color: var(--red-arrow); }

    .waiting {
      height: var(--row-h); line-height: 1.3;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; letter-spacing: 0.12em;
      color: rgba(240,208,128,0.6); text-transform: uppercase;
    }
  </style>
</head>
<body>
<div id="root">
  <div id="anchor">
    <div id="panel">
      <div id="header">
        <div id="pip-cluster">
          <div id="pip-label">Guesses</div>
          <div id="pip-row"></div>
        </div>
        <div id="title-block">
          <div id="title-stars">✦ &nbsp; ✦ &nbsp; ✦</div>
          <div id="title">Eldendle</div>
          <div id="subtitle">Type !guess [ Boss ] to play</div>
        </div>
        <div id="gcount"></div>
      </div>
      <div id="window"><div id="reel"></div></div>
    </div>
  </div>
</div>

<script src="./app.js"></script>
<script>
  (function () {
    var sid = null;
    setInterval(function () {
      fetch('/health', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!sid) { sid = d.sessionId; return; }
          if (d.sessionId && d.sessionId !== sid) location.reload();
        })
        .catch(function () {});
    }, 5000);
  })();
</script>
</body>
</html>
