<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elden Cards</title>
<script src="cards.js"></script>
<style>
  @font-face { font-family:'Mantinia'; src:url('Mantinia Regular.otf') format('opentype'); }
  @font-face { font-family:'Garamond';  src:url('Garamond-Regular.ttf') format('truetype'); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
  body { font-family:'Mantinia',Georgia,serif; }
  .table { position:absolute; inset:0; perspective:2600px; }
  .slot { position:absolute; left:50%; top:52%; width:600px; height:825px; margin:-412px 0 0 -300px;
    transition:transform .9s cubic-bezier(.22,.9,.24,1), opacity .5s ease; opacity:0; }
  .slot.in { opacity:1; }
  .flipper { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform 1.05s cubic-bezier(.45,.05,.2,1); }
  .slot.up .flipper { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:10px; overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow:0 18px 40px rgba(0,0,0,.55); }
  .face.front { transform:rotateY(180deg); }
  .face.back img { width:100%; height:100%; display:block; object-fit:fill; }
  .glow { position:absolute; inset:-40px; z-index:-1; border-radius:24px; filter:blur(24px); opacity:0; transition:opacity .8s ease; }
  .slot.up .glow { opacity:1; animation:shimmer 2.2s ease-in-out infinite alternate; }
  .r-Rare .glow { background:radial-gradient(ellipse,rgba(70,130,255,.85),transparent 70%); }
  .r-Epic .glow { background:radial-gradient(ellipse,rgba(148,0,255,.9),transparent 70%); }
  .r-Legendary .glow { background:radial-gradient(ellipse,rgba(210,160,20,.95),transparent 70%); }
  @keyframes shimmer { from{opacity:.5} to{opacity:1} }
  .frame { position:absolute; inset:0; width:600px; height:825px; z-index:3; pointer-events:none; }
  .r-Common .frame { filter:saturate(.25) brightness(1.1) hue-rotate(200deg); }
  .r-Rare .frame { filter:sepia(1) hue-rotate(207deg) saturate(1.6); }
  .r-Epic .frame { filter:sepia(1) hue-rotate(268deg) saturate(2.8) brightness(.88); }
  .r-Legendary .frame { filter:sepia(1) hue-rotate(10deg) saturate(2.2) brightness(1.06); }
  .art { position:absolute; left:51px; top:98px; width:499px; height:360px; object-fit:cover; object-position:top center; }
  .nm { position:absolute; top:30px; left:60px; right:60px; height:75px; line-height:75px; font-size:38px; font-weight:bold; font-variant:small-caps; color:#3a2810; white-space:nowrap; overflow:hidden; z-index:4; }
  .hd { position:absolute; top:455px; left:60px; right:60px; height:60px; display:flex; align-items:center; font-size:27px; font-weight:bold; font-variant:small-caps; color:#3a2810; white-space:nowrap; overflow:hidden; z-index:4; }
  .ds { position:absolute; top:530px; left:60px; right:60px; max-height:210px; font-family:'Garamond',Georgia,serif; font-size:28px; color:#2e1c08; line-height:1.35; text-align:justify; overflow:hidden; z-index:4; }
  .no { position:absolute; left:464px; top:741px; width:72px; height:28px; display:flex; align-items:center; justify-content:center; font-family:'Garamond',Georgia,serif; font-size:37px; font-weight:bold; color:#3a2810; z-index:4; }
  #who { position:absolute; left:0; right:0; top:22px; text-align:center; font-size:55px; font-variant:small-caps; color:#c8a84a; text-shadow:0 1px 4px rgba(0,0,0,.85); opacity:0; transition:opacity .5s; }
  #who.on { opacity:1; }
  #play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font:400 44px "Palatino Linotype",Palatino,Georgia,serif; letter-spacing:.34em; text-transform:uppercase; color:#f0b13c; background:rgba(7,6,6,.82); border:1px solid rgba(240,177,60,.6); border-radius:2px; padding:26px 70px; cursor:pointer; transition:letter-spacing .3s, box-shadow .3s; z-index:20; }
  #play:hover { letter-spacing:.42em; box-shadow:0 0 30px rgba(240,177,60,.3); }
</style>
</head>
<body>
<div id="who">Prof</div>
<div class="table" id="table"></div>
<button id="play" type="button">Play</button>
<script>
(function(){
  var table=document.getElementById('table'), who=document.getElementById('who');
  function pad3(n){ return String(n).padStart(3,'0'); }
  function card(c, display){
    var s=document.createElement('div'); s.className='slot r-'+c.rarity;
    s.innerHTML='<div class="glow"></div><div class="flipper"><div class="face back"><img src="images/000A.png" alt=""></div>'+
      '<div class="face front"><img class="art" alt=""><img class="frame" src="images/000B.png" alt=""><div class="nm"></div><div class="hd"></div><div class="ds"></div><div class="no"></div></div></div>';
    s.querySelector('.art').src='images/'+pad3(c.id)+'.jpg';
    s.querySelector('.nm').textContent=display||c.name;
    s.querySelector('.hd').textContent=c.type+' — '+c.region;
    s.querySelector('.ds').textContent=c.description;
    s.querySelector('.no').textContent=pad3(c.id);
    table.appendChild(s);
    var nm=s.querySelector('.nm'), size=38; while(nm.scrollWidth>nm.clientWidth && size>18){ size-=1; nm.style.fontSize=size+'px'; }
    var hd=s.querySelector('.hd'), hs=27; while(hd.scrollWidth>hd.clientWidth && hs>14){ hs-=1; hd.style.fontSize=hs+'px'; }
    return s;
  }
  function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  function place(s, x, y, rot, sc){ s.style.transform='translate('+x+'px,'+y+'px) rotate('+rot+'deg) scale('+sc+')'; }

  async function single(){
    table.innerHTML='';
    var s=card(CARDS[0],'Malenia, Goddess of Rot');
    place(s,0,40,0,.98); await wait(30); s.classList.add('in'); who.classList.add('on');
    await wait(1400); s.classList.add('up');
    await wait(4200); s.classList.remove('up');
    await wait(1600); s.classList.remove('in'); who.classList.remove('on');
    await wait(700);
  }
  async function fan(){
    table.innerHTML='';
    var five=CARDS.slice(1,6), slots=five.map(function(c){ return card(c); });
    slots.forEach(function(s){ place(s,0,60,0,.5); });
    await wait(30);
    slots.forEach(function(s){ s.classList.add('in'); }); who.classList.add('on');
    await wait(500);
    slots.forEach(function(s,i){ var k=i-2; place(s,k*330,10+Math.abs(k)*26,k*7,.6); });
    await wait(1100);
    for(var i=0;i<slots.length;i++){ slots[i].classList.add('up'); await wait(650); }
    await wait(3600);
    for(var j=slots.length-1;j>=0;j--){ slots[j].classList.remove('up'); await wait(250); }
    await wait(1200);
    slots.forEach(function(s){ place(s,0,60,0,.5); });
    await wait(900);
    slots.forEach(function(s){ s.classList.remove('in'); }); who.classList.remove('on');
    await wait(700);
  }
  async function loop(){ for(;;){ await single(); await fan(); } }
  var btn=document.getElementById('play');
  btn.addEventListener('click',function(){ btn.remove(); loop(); });
  if(/[?&]play/.test(location.search)){ btn.remove(); loop(); }
})();
</script>
</body>
</html>
