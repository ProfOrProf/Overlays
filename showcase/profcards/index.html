<!DOCTYPE html>
<html lang="en">
<head>
<style>#demoControls{position:fixed;left:50%;bottom:4px;transform:translateX(-50%);display:flex;gap:14px;z-index:99}#demoControls button{font:400 22px "Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.3em;text-transform:uppercase;color:#f0b13c;background:rgba(7,6,6,.75);border:1px solid rgba(240,177,60,.5);border-radius:2px;padding:14px 34px;cursor:pointer;transition:letter-spacing .3s,box-shadow .3s}#demoControls button:hover{letter-spacing:.38em;box-shadow:0 0 30px rgba(240,177,60,.25)}</style>
<script src="demo.js"></script>

<meta charset="UTF-8">
<title>ProfCards Overlay</title>
<style>
  :root {
    --card-w:600px; --card-h:825px;
    --img-x:51px; --img-y:98px; --img-w:499px; --img-h:360px;
    --name-top:30px; --name-h:75px; --name-size:38px; --name-min:14px;
    --token-size:35px; --token-right:52px;
    --hdr-top:455px; --hdr-h:60px; --hdr-size:30px; --hdr-min:14px;
    --desc-top:530px; --desc-left:60px; --desc-right:60px; --desc-size:28px; --desc-min:18px;
    --num-cx:500px; --num-cy:755px; --num-size:37px;
    --user-size:98px; --user-min:22px;
    --label-size:83px; --label-min:14px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  /* horizontal: only ~115px headroom above the card — the 2-line user block must shrink to fit */
  html:not(.vertical) { --user-size:56px; --label-size:64px; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  /* vertical YT/TikTok feed: 1080x1920 canvas so every 50%-centered element lands on true center */
  html.vertical, body.vertical { width:1080px; height:1920px; }
  body { background:transparent; position:relative; font-family:'HeaderFont',Georgia,serif; }

  .card-username { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(50% + var(--card-h)/2 + 12px); font-family:'HeaderFont',Georgia,serif; font-size:var(--user-size); line-height:1; font-weight:normal; font-variant:small-caps; color:#fff; letter-spacing:1px; text-align:center; text-shadow:-1px -1px 0 rgba(0,0,0,.9),1px -1px 0 rgba(0,0,0,.9),-1px 1px 0 rgba(0,0,0,.9),1px 1px 0 rgba(0,0,0,.9),0 0 20px rgba(255,255,255,1.0),0 0 10px rgba(255,255,255,.8); transition:opacity 2s ease; opacity:0; white-space:nowrap; overflow:visible; max-width:calc(var(--card-w) + 30px); }
  .card-username .binder-part { display:block; font-size:0.62em; opacity:0; transition:opacity 0.6s ease; will-change:transform; }
  .card-username .binder-part.count-pop { animation:count-pop 0.5s ease; }
  @keyframes count-pop { 0%{transform:scale(1)} 40%{transform:scale(1.35); text-shadow:0 0 26px rgba(255,226,122,1),0 0 12px rgba(255,255,255,.9)} 100%{transform:scale(1)} }

  /* ── 5-pack ceremony ── */
  #packStage { position:absolute; top:50%; left:50%; width:0; height:0; transform:scale(1); transition:transform 0.8s ease; }
  .pack-card { position:absolute; left:calc(var(--card-w) / -2); top:calc(var(--card-h) / -2);
               width:var(--card-w); height:var(--card-h); transform-style:preserve-3d;
               transition:transform 0.65s ease, opacity 0.4s ease; opacity:0; }
  .pack-flip { position:absolute; inset:0; transform-style:preserve-3d; transition:transform 0.7s ease-in-out; transform:rotateY(180deg); }
  .pack-flip.show-front { transform:rotateY(0deg); }
  .pack-flip .pface { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:40px; overflow:hidden; box-shadow:0 10px 26px rgba(0,0,0,.5); }
  .pack-flip .pback { transform:rotateY(180deg); }
  .pack-card .rt { position:absolute; top:var(--name-top); right:var(--token-right); width:var(--token-size); height:var(--name-h); object-fit:contain; object-position:right center; z-index:5; }
  /* animation ONLY while .on — a running animation overrides opacity:0 and the glow never dies */
  .pack-glow { position:absolute; left:-360px; top:-460px; width:720px; height:920px; border-radius:40px; filter:blur(26px); opacity:0; transition:opacity 0.8s ease; pointer-events:none; }
  .pack-glow.on { opacity:1; animation:glow-pulse 2.2s ease-in-out infinite alternate; }
  .pack-glow.g-c  { background:radial-gradient(ellipse at 50% 50%,rgba(176,176,176,.7) 0%,transparent 70%); }
  .pack-glow.g-uc { background:radial-gradient(ellipse at 50% 50%,rgba(76,175,80,.85) 0%,rgba(40,140,50,.5) 35%,transparent 70%); }
  .pack-glow.g-r  { background:radial-gradient(ellipse at 50% 50%,rgba(33,150,243,.85) 0%,rgba(20,90,200,.5) 35%,transparent 70%); }
  .pack-glow.g-e  { background:radial-gradient(ellipse at 50% 50%,rgba(148,0,255,.95) 0%,rgba(120,20,220,.65) 35%,rgba(80,0,180,.25) 55%,transparent 72%); }
  .pack-glow.g-l  { background:radial-gradient(ellipse at 50% 50%,rgba(210,160,20,.95) 0%,rgba(180,120,0,.68) 35%,rgba(140,90,0,.28) 55%,transparent 72%); }
  .pack-glow.g-u  { background:radial-gradient(ellipse 80% 65% at 50% 50%,rgba(255,85,0,1.0) 0%,rgba(255,50,0,.90) 22%,rgba(255,20,0,.55) 46%,rgba(200,0,0,.20) 63%,transparent 80%); }
  @keyframes pack-fly-right { 0%{opacity:1} 100%{transform:translateX(2000px) rotate(540deg) scale(var(--fan-scale,1)); opacity:0} }
  .pack-card.toss { animation:pack-fly-right 0.75s ease-in forwards; }
  #packLabel { position:absolute; left:50%; transform:translateX(-50%); top:calc(50% + var(--pack-label-y, 330px));
               font-family:'DescFont','HeaderFont',Georgia,serif; font-size:80px; font-weight:bold; font-variant:small-caps;
               color:#fff; letter-spacing:2px; white-space:nowrap;
               text-shadow:-1px -1px 0 rgba(0,0,0,.9),1px -1px 0 rgba(0,0,0,.9),-1px 1px 0 rgba(0,0,0,.9),1px 1px 0 rgba(0,0,0,.9),0 0 22px rgba(255,255,255,1.0);
               opacity:0; transition:opacity 0.8s ease; }
  .card-wrap { position:relative; transition:opacity 2s ease; opacity:0; }
  .card-wrap.shiny::before { content:''; position:absolute; inset:-28px; z-index:-1; background:radial-gradient(ellipse at 50% 48%,rgba(255,210,60,.75) 0%,rgba(255,170,0,.4) 35%,transparent 65%); filter:blur(18px); animation:shimmer 2.2s ease-in-out infinite alternate; border-radius:20px; }
  .card { position:relative; width:var(--card-w); height:var(--card-h); border-radius:40px; overflow:hidden; z-index:1; flex-shrink:0; }

  @keyframes shimmer { from{opacity:.5} to{opacity:1.0} }
  .card.rarity-c  .card-frame { filter:saturate(0.25) brightness(1.1) hue-rotate(200deg); }
  .card.rarity-uc .card-frame { filter:sepia(1) hue-rotate(90deg) saturate(2.2) brightness(0.95); }
  .card.rarity-r  .card-frame { filter:sepia(1) hue-rotate(207deg) saturate(1.6) brightness(1.0); }
  .card.rarity-e  .card-frame { filter:sepia(1) hue-rotate(268deg) saturate(2.8) brightness(0.88); }
  .card.rarity-l  .card-frame { filter:sepia(1) hue-rotate(10deg) saturate(2.2) brightness(1.06); }
  .card.rarity-u  .card-frame { filter:sepia(1) hue-rotate(343deg) saturate(2.8) brightness(0.92); }
  .card-glow { position:absolute; inset:-50px; pointer-events:none; border-radius:30px; opacity:0; transition:opacity 0.5s ease; }
  .card-glow.glow-flip      { background:radial-gradient(ellipse at 50% 50%,rgba(220,50,50,.9) 0%,rgba(180,0,0,.6) 35%,transparent 70%); filter:blur(22px); opacity:1; }
  .card-glow.glow-epic      { background:radial-gradient(ellipse at 50% 50%,rgba(148,0,255,.95) 0%,rgba(120,20,220,.65) 35%,rgba(80,0,180,.25) 55%,transparent 72%); filter:blur(22px); animation:glow-pulse 2.4s ease-in-out infinite alternate; }
  .card-glow.glow-legendary { background:radial-gradient(ellipse at 50% 50%,rgba(210,160,20,.95) 0%,rgba(180,120,0,.68) 35%,rgba(140,90,0,.28) 55%,transparent 72%); filter:blur(22px); animation:glow-pulse 2.2s ease-in-out infinite alternate; }
  .card-glow.glow-unique    { background:radial-gradient(ellipse 80% 65% at 50% 50%,rgba(255,85,0,1.0) 0%,rgba(255,50,0,.90) 22%,rgba(255,20,0,.55) 46%,rgba(200,0,0,.20) 63%,transparent 80%); filter:blur(28px); animation:glow-pulse 2.0s ease-in-out infinite alternate; }
  @keyframes glow-pulse { from{opacity:.6} to{opacity:1.0} }
  .card-label { position:absolute; left:50%; transform:translateX(-50%); top:calc(50% + var(--card-h)/2 + 12px); font-family:'DescFont','HeaderFont',Georgia,serif; font-size:var(--label-size); line-height:1; font-weight:normal; font-variant:small-caps; color:#fff; letter-spacing:1px; text-align:center; text-shadow:-1px -1px 0 rgba(0,0,0,.9),1px -1px 0 rgba(0,0,0,.9),-1px 1px 0 rgba(0,0,0,.9),1px 1px 0 rgba(0,0,0,.9),0 0 20px rgba(255,255,255,1.0),0 0 10px rgba(255,255,255,.8); transition:opacity 2s ease; opacity:0; white-space:nowrap; overflow:hidden; max-width:calc(var(--card-w) + 30px); }
  .card.holo::after { content:''; position:absolute; inset:0; z-index:10; clip-path:inset(0 round 40px); background:linear-gradient(315deg,transparent 0%,transparent 42%,rgba(255,80,160,.16) 45%,rgba(255,210,80,.16) 48%,rgba(80,255,190,.16) 51%,rgba(110,120,255,.16) 54%,rgba(230,80,255,.16) 57%,rgba(80,220,255,.16) 60%,transparent 63%,transparent 100%); background-size:300% 300%; animation:holo-shift 5s ease-in-out infinite; pointer-events:none; }
  @keyframes holo-shift { 0%{background-position:0% 0%} 50%{background-position:100% 100%} 100%{background-position:0% 0%} }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

  .card.prebuilt .bg-img { left:0; top:0; width:var(--card-w); height:var(--card-h); object-fit:cover; object-position:center; border-radius:inherit; }
  .card.prebuilt .card-frame,
  .card.prebuilt .card-name,
  .card.prebuilt .card-header,
  .card.prebuilt .card-desc,
  .card.prebuilt .card-num,
  .card.prebuilt #rarityToken,
  .card.prebuilt .rt { display:none; }

  .card-wrap.prebuilt.rarity-c::after  { content:''; position:absolute; inset:-30px; z-index:-1; background:radial-gradient(ellipse at 50% 50%,rgba(176,176,176,.7) 0%,transparent 70%); filter:blur(16px); border-radius:18px; }
  .card-wrap.prebuilt.rarity-uc::after { content:''; position:absolute; inset:-30px; z-index:-1; background:radial-gradient(ellipse at 50% 50%,rgba(76,175,80,.85) 0%,transparent 70%); filter:blur(16px); border-radius:18px; }
  .card-wrap.prebuilt.rarity-r::after  { content:''; position:absolute; inset:-30px; z-index:-1; background:radial-gradient(ellipse at 50% 50%,rgba(33,150,243,.85) 0%,transparent 70%); filter:blur(16px); border-radius:18px; }
  .card-wrap.prebuilt.rarity-e::after  { content:''; position:absolute; inset:-30px; z-index:-1; background:radial-gradient(ellipse at 50% 50%,rgba(148,0,255,.95) 0%,rgba(80,0,180,.3) 50%,transparent 72%); filter:blur(16px); border-radius:18px; }
  .card-wrap.prebuilt.rarity-l::after  { content:''; position:absolute; inset:-30px; z-index:-1; background:radial-gradient(ellipse at 50% 50%,rgba(210,160,20,.95) 0%,rgba(140,90,0,.3) 50%,transparent 72%); filter:blur(16px); border-radius:18px; }
  .card-wrap.prebuilt.rarity-u::after  { content:''; position:absolute; inset:-30px; z-index:-1; background:radial-gradient(ellipse 80% 65% at 50% 50%,rgba(255,85,0,1) 0%,rgba(255,20,0,.6) 45%,transparent 80%); filter:blur(20px); border-radius:18px; }

  .bg-img,.boss-img { position:absolute; left:var(--img-x); top:var(--img-y); width:var(--img-w); height:var(--img-h); object-fit:cover; object-position:top center; }
  .card-frame { position:absolute; top:0; left:0; width:var(--card-w); height:var(--card-h); pointer-events:none; z-index:3; }
  .card-name { position:absolute; top:var(--name-top); left:60px; right:calc(var(--token-right) + var(--token-size) + 10px); height:var(--name-h); line-height:var(--name-h); font-family:'HeaderFont',Georgia,serif; font-size:var(--name-size); font-weight:bold; font-variant:small-caps; color:#3a2810; text-align:left; text-shadow:0 1px 2px rgba(255,255,255,.3); letter-spacing:.5px; white-space:nowrap; overflow:hidden; z-index:4; }
  .card-header { position:absolute; top:var(--hdr-top); left:60px; right:60px; height:var(--hdr-h); display:flex; align-items:center; font-family:'HeaderFont',Georgia,serif; font-size:var(--hdr-size); font-weight:bold; font-variant:small-caps; color:#3a2810; letter-spacing:.5px; text-shadow:0 1px 1px rgba(255,255,255,.35); white-space:nowrap; overflow:hidden; z-index:4; }
  .card-desc { position:absolute; top:var(--desc-top); left:var(--desc-left); right:var(--desc-right); max-height:210px; font-family:'DescFont','HeaderFont',Georgia,serif; font-size:var(--desc-size); font-weight:normal; color:#2e1c08; line-height:1.35; text-align:justify; text-shadow:0 1px 1px rgba(255,255,255,.2); overflow:hidden; z-index:4; }
  .card-num { position:absolute; left:calc(var(--num-cx) - 36px); top:calc(var(--num-cy) - 14px); width:72px; height:28px; display:flex; align-items:center; justify-content:center; font-family:'DescFont','HeaderFont',Georgia,serif; font-size:var(--num-size); font-weight:bold; color:#3a2810; letter-spacing:2px; text-shadow:0 1px 1px rgba(255,255,255,.3); z-index:4; }
  .pull-badge { position:absolute; left:var(--img-x); width:var(--img-w); top:calc(var(--img-y) + var(--img-h) - 60px); height:60px; display:flex; align-items:center; justify-content:center; font-family:'DescFont','HeaderFont',Georgia,serif; font-size:48px; font-weight:bold; text-transform:uppercase; color:white; text-shadow:-1px -1px 0 rgba(0,0,0,.9),1px -1px 0 rgba(0,0,0,.9),-1px 1px 0 rgba(0,0,0,.9),1px 1px 0 rgba(0,0,0,.9),0 0 20px rgba(255,255,255,1.0),0 0 10px rgba(255,255,255,.8); pointer-events:none; z-index:5; }
  .pull-badge.blinking { animation:blink .9s step-end infinite; }
  .scene { perspective:1200px; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
  .card-flip { position:relative; width:var(--card-w); height:var(--card-h); transform-style:preserve-3d; transition:transform 1s ease-in-out; }
  .card-flip.flipped { transform:rotateY(180deg); }
  .card-face { position:absolute; inset:0; backface-visibility:hidden; }
  .card-back-face { transform:rotateY(180deg); }
  #rarityToken { position:absolute; top:var(--name-top); right:var(--token-right); width:var(--token-size); height:var(--name-h); object-fit:contain; object-position:right center; z-index:5; pointer-events:none; }

</style>
</head>
<body>

<div class="card-username" id="cardUsername"><span id="cardUserText"></span><span class="binder-part" id="cardBinderText"></span></div>
<div class="scene">
  <div class="card-glow" id="cardGlow"></div>
  <div class="card-wrap" id="cardWrap">
    <div class="card-flip" id="cardFlip">
      <div class="card-face card-front">
        <div class="card" id="testCard">
          <img class="bg-img"   id="bgImg"   src="" alt="" style="display:none">
          <img class="boss-img" id="bossImg" src="" alt="" style="display:none">
          <img class="card-frame" id="cardFrame" src="" alt="">
          <img id="rarityToken" src="" alt="">
          <div class="card-name"   id="cardName"></div>
          <div class="card-header" id="cardHeader"></div>
          <div class="card-desc"   id="cardDesc"></div>
          <div class="card-num"    id="cardNum"></div>
          <div class="pull-badge"  id="pullBadge"></div>
        </div>
      </div>
      <div class="card-face card-back-face">
        <img id="cardBackImg" src="" alt="" style="width:100%;height:100%;object-fit:fill;">
      </div>
    </div>
  </div>
</div>
<div id="cardLabel" class="card-label"></div>

<div id="packStage"></div>
<div id="packLabel">5 Pack!</div>

<script>
const RARITY_TOKEN = {
  Common:    'Decks/RarityTokens/C.png',
  Uncommon:  'Decks/RarityTokens/UC.png',
  Rare:      'Decks/RarityTokens/R.png',
  Epic:      'Decks/RarityTokens/E.png',
  Legendary: 'Decks/RarityTokens/L.png',
  Unique:    'Decks/RarityTokens/Star.png',
};
const RARITY_CLASS = {Common:'rarity-c',Uncommon:'rarity-uc',Rare:'rarity-r',Epic:'rarity-e',Legendary:'rarity-l',Unique:'rarity-u'};

const PLATFORM     = (new URLSearchParams(location.search).get('platform') || '').toLowerCase();
if (PLATFORM === 'youtube' || PLATFORM === 'tiktok') {   // vertical 1080x1920 canvas so cards center
  document.documentElement.classList.add('vertical');
  if (document.body) document.body.classList.add('vertical');
}
const STATE_URL    = '/games/profcards' + (PLATFORM ? '/' + PLATFORM : '') + '/state';
const POLL_MS      = 1000;
const T_BACK_HIDE  = 5000;
const T_BADGE_SHOW = 7000;
const T_FADE_OUT   = 13000;
const T_RESET      = 15000;

var lastQueueId     = -1;
var currentDeckPath = null;
var _fontStyles     = {};
var timers          = [];

function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function pad3(n) { return String(n).padStart(3,'0'); }

function ensureFonts(deckPath, headerFont, descFont) {
  if (!_fontStyles[deckPath]) {
    var safe  = deckPath.replace(/[^a-zA-Z0-9]/g,'_');
    var hName = 'HF_' + safe;
    var dName = descFont ? ('DF_' + safe) : null;
    var hExt  = headerFont.split('.').pop().toLowerCase();
    var css   = "@font-face{font-family:'" + hName + "';src:url('" + deckPath + '/' + headerFont + "') format('" + (hExt==='otf'?'opentype':'truetype') + "');}";
    if (descFont) {
      var dExt = descFont.split('.').pop().toLowerCase();
      css += "@font-face{font-family:'" + dName + "';src:url('" + deckPath + '/' + descFont + "') format('" + (dExt==='otf'?'opentype':'truetype') + "');}";
    }
    var s = document.createElement('style'); s.textContent = css; document.head.appendChild(s);
    _fontStyles[deckPath] = { h: hName, d: dName };
  }
  if (deckPath !== currentDeckPath) {
    currentDeckPath = deckPath;
    var fs = _fontStyles[deckPath];
    var hS = "'" + fs.h + "',Georgia,serif";
    var dS = fs.d ? ("'" + fs.d + "','" + fs.h + "',Georgia,serif") : hS;
    ['cardUsername','cardName','cardHeader'].forEach(function(id){
      var el=document.getElementById(id); if(el) el.style.fontFamily=hS;
    });
    ['cardLabel','cardDesc','cardNum','pullBadge'].forEach(function(id){
      var el=document.getElementById(id); if(el) el.style.fontFamily=dS;
    });
  }
  var fs2 = _fontStyles[deckPath];
  var waits = [document.fonts.load('1em "' + fs2.h + '"')];
  if (fs2.d) waits.push(document.fonts.load('1em "' + fs2.d + '"'));
  return Promise.all(waits).catch(function(){  });
}

function fitText(elId, cssVar, cssMin, text) {
  var el   = document.getElementById(elId);
  var root = getComputedStyle(document.documentElement);
  var max  = parseFloat(root.getPropertyValue(cssVar));
  var min  = parseFloat(root.getPropertyValue(cssMin));
  el.textContent = text;
  var size = max; el.style.fontSize = size + 'px';
  while (el.scrollWidth > el.clientWidth && size > min) { size -= 0.5; el.style.fontSize = size.toFixed(1) + 'px'; }
}

// The description is the one multi-line text node — fit it by HEIGHT (clips at max-height otherwise).
// DESC_MAX is a backstop cap only: fit-to-height already handles real content (DS1 tops out at 300,
// which fits above the 18px floor); this just guards a runaway future description from shrinking to dust.
var DESC_MAX = 300;
function capDesc(t) {
  t = t || '';
  return t.length > DESC_MAX ? t.slice(0, DESC_MAX - 1).replace(/\s+\S*$/, '') + '…' : t;
}
function fitNodeHeight(el, cssVar, cssMin) {
  if (!el) return;
  var root = getComputedStyle(document.documentElement);
  var size = parseFloat(root.getPropertyValue(cssVar));
  var min  = parseFloat(root.getPropertyValue(cssMin));
  el.style.fontSize = size + 'px';
  while (el.scrollHeight > el.clientHeight && size > min) { size -= 0.5; el.style.fontSize = size.toFixed(1) + 'px'; }
}

var lastBinderUser = '', lastBinderCount = -1;

function fitUserBinder(name, binderStr, userCardCount) {
  var el       = document.getElementById('cardUsername');
  var nameSpan = document.getElementById('cardUserText');
  var bindSpan = document.getElementById('cardBinderText');
  var root     = getComputedStyle(document.documentElement);
  var max      = parseFloat(root.getPropertyValue('--user-size'));
  var min      = parseFloat(root.getPropertyValue('--user-min'));
  // strip a leading @ (YouTube handles) so it doesn't read as a stray glyph in the card font
  nameSpan.textContent = (name || '').replace(/^@/, '');
  bindSpan.textContent = binderStr || '';
  // NOTE: rarity/count line starts hidden (CSS opacity:0) and is faded in POST-FLIP by renderCard,
  // so viewers don't learn rarity or new/repeat until the card turns over. The count-pop is
  // re-triggered at that reveal. Tracking only here.
  lastBinderUser  = name;
  lastBinderCount = userCardCount != null ? userCardCount : -1;
  el.style.fontSize = max + 'px';
  while (el.scrollWidth > el.clientWidth && max > min) { max -= 0.5; el.style.fontSize = max.toFixed(1) + 'px'; }
}

function applyRarity(rarityStr, isPrebuilt) {
  var wrap = document.getElementById('cardWrap');
  var card = document.getElementById('testCard');
  var cls  = RARITY_CLASS[rarityStr] || 'rarity-c';
  Object.values(RARITY_CLASS).forEach(function(c){ wrap.classList.remove(c); card.classList.remove(c); });
  if (!isPrebuilt) { wrap.classList.add(cls); card.classList.add(cls); }
  if (isPrebuilt) wrap.classList.add('prebuilt'); else wrap.classList.remove('prebuilt');
  if (isPrebuilt) card.classList.add('prebuilt'); else card.classList.remove('prebuilt');
}

async function renderCard(entry) {
  var incomingDp = entry.deckPath;
  if (currentDeckPath !== null && incomingDp && incomingDp !== currentDeckPath &&
      sessionStorage.getItem('cards_reloaded_for') !== incomingDp) {
    sessionStorage.setItem('cards_reloaded_for', incomingDp);
    location.reload();
    return;
  }
  if (sessionStorage.getItem('cards_reloaded_for') === incomingDp)
    sessionStorage.removeItem('cards_reloaded_for');

  clearTimers();
  var cycleMs   = entry.cycleMs || T_RESET;
  var scale     = cycleMs / T_RESET;
  function dur(sec){ return (sec * scale).toFixed(2) + 's'; }
  var tBackHide = T_BACK_HIDE  * scale;
  var tBadge    = T_BADGE_SHOW * scale;
  var tFade     = T_FADE_OUT   * scale;
  var tReset    = T_RESET      * scale;
  var wrap    = document.getElementById('cardWrap');
  var user    = document.getElementById('cardUsername');
  var card    = document.getElementById('testCard');
  var flip    = document.getElementById('cardFlip');
  var bgImg   = document.getElementById('bgImg');
  var bossImg = document.getElementById('bossImg');
  var badge   = document.getElementById('pullBadge');
  var frame   = document.getElementById('cardFrame');
  var backImg = document.getElementById('cardBackImg');
  var glow    = document.getElementById('cardGlow');
  var label   = document.getElementById('cardLabel');

  flip.style.transition='none'; flip.classList.add('flipped'); flip.getBoundingClientRect(); flip.style.transition='';
  card.classList.remove('holo');
  wrap.classList.remove('shiny'); card.classList.remove('shiny');
  glow.className = 'card-glow';

  var dp = entry.deckPath;
  await ensureFonts(dp, entry.headerFont, entry.descFont);
  frame.src   = dp + '/' + entry.cardBackFront;
  backImg.src = dp + '/' + entry.cardBackBack;

  var isPrebuilt = entry.renderMode === 'prebuilt';
  var isNF       = entry.renderMode === 'nightfarer';
  var suffix     = entry.imageSuffix || '';
  var imgBase    = dp + '/' + entry.edition + '/' + pad3(entry.cardId) + suffix;

  document.getElementById('rarityToken').src = RARITY_TOKEN[entry.rarity] || RARITY_TOKEN['Common'];
  applyRarity(entry.rarity, isPrebuilt);

  if (!isPrebuilt) {
    fitText('cardName',   '--name-size', '--name-min', entry.displayName);
    fitText('cardHeader', '--hdr-size',  '--hdr-min',  entry.category + (entry.region ? ' — ' + entry.region : ''));
    var descEl = document.getElementById('cardDesc');
    descEl.textContent = capDesc(entry.description || '');
    fitNodeHeight(descEl, '--desc-size', '--desc-min');
    document.getElementById('cardNum').textContent  = '#' + pad3(entry.cardId);
  }
  var binderStr = (entry.rarity || '') + ' - ' + (entry.userCardCount != null ? entry.userCardCount : '?') + '/' + (entry.deckTotal != null ? entry.deckTotal : '?');
  fitUserBinder(entry.userDisplay, binderStr, entry.userCardCount);
  var labelText = '#' + pad3(entry.cardId) + ' — ' + entry.displayName;
  fitText('cardLabel', '--label-size', '--label-min', labelText);

  if (entry.isShiny) { wrap.classList.add('shiny'); card.classList.add('shiny'); }

  if (isNF) {
    bgImg.style.display='none'; bgImg.src='';
    bossImg.style.display=''; bossImg.src=imgBase+'.jpg';
    bossImg.onerror=function(){ bossImg.style.display='none'; };
  } else {
    bgImg.style.display=''; bgImg.src=imgBase+'.jpg';
    bgImg.onerror=function(){ bgImg.style.display='none'; };
    bossImg.style.display='none'; bossImg.src='';
  }

  var bindSpan = document.getElementById('cardBinderText');
  badge.textContent=''; badge.classList.remove('blinking');
  wrap.style.transition='none'; wrap.style.opacity='0';
  user.style.transition='none'; user.style.opacity='0';
  bindSpan.style.transition='none'; bindSpan.style.opacity='0'; bindSpan.classList.remove('count-pop');  // rarity hidden until post-flip
  label.style.transition='none'; label.style.opacity='0';
  glow.className = 'card-glow';   /* no red flip-glow on the face-down card; rarity glows still fire on reveal */
  timers.push(setTimeout(function(){
    wrap.style.transition='opacity ' + dur(1) + ' ease'; wrap.style.opacity='1';
    user.style.transition='opacity ' + dur(1) + ' ease'; user.style.opacity='1';
  }, 50));

  var isHolo = entry.isHolo;
  var isNew  = entry.isNew;
  var cnt    = entry.userCount;

  timers.push(setTimeout(function(){
    flip.style.transition='transform ' + dur(1) + ' ease-in-out';
    flip.classList.remove('flipped');
    if (isHolo) card.classList.add('holo');
    glow.classList.remove('glow-flip');
    if (isPrebuilt) {
      var rcls = RARITY_CLASS[entry.rarity] || 'rarity-c';
      wrap.classList.add(rcls);
    }
    var rg = {Epic:'glow-epic',Legendary:'glow-legendary',Unique:'glow-unique'}[entry.rarity];
    if (rg) glow.classList.add(rg);
    label.style.transition='opacity ' + dur(1) + ' ease'; label.style.opacity='1';
  }, tBackHide));

  timers.push(setTimeout(function(){
    badge.textContent = isNew ? 'New!' : 'Repeat \xd7' + cnt + '!';
    badge.classList.add('blinking');
    // rarity + deck-count line fades in NOW (post-flip) — first moment viewers learn rarity/new.
    bindSpan.style.transition='opacity 0.6s ease'; bindSpan.style.opacity='1';
    if (isNew) { bindSpan.classList.remove('count-pop'); void bindSpan.offsetWidth; bindSpan.classList.add('count-pop'); }
  }, tBadge));

  timers.push(setTimeout(function(){
    wrap.style.transition='opacity ' + dur(2) + ' ease'; wrap.style.opacity='0';
    user.style.transition='opacity ' + dur(2) + ' ease'; user.style.opacity='0';
    label.style.transition='opacity ' + dur(2) + ' ease'; label.style.opacity='0';
    glow.classList.remove('glow-flip','glow-epic','glow-legendary','glow-unique');
  }, tFade));

  timers.push(setTimeout(function(){
    card.classList.remove('holo');
    wrap.classList.remove('shiny','prebuilt'); card.classList.remove('shiny','prebuilt');
    flip.style.transition='none'; flip.classList.add('flipped');
    wrap.style.opacity='0'; user.style.opacity='0'; user.style.fontSize='';
    bindSpan.style.opacity='0'; bindSpan.classList.remove('count-pop');
    label.style.opacity='0'; label.textContent=''; label.style.fontSize='';
    badge.textContent=''; badge.classList.remove('blinking');
    bgImg.src=''; bossImg.src=''; frame.src=''; backImg.src='';
    glow.className = 'card-glow';
  }, tReset));
}

/* ── 5-pack ceremony ─────────────────────────────────────────────────────
   stack (rarest glow at the bottom) → top card flips, 2.5s hold, slides left
   into a war-style stack → rarest flips LAST → regather center → fan out
   (scaled to fit the canvas) → "5 Pack!" + all info → war-toss off right.  */
var packTimers = [];
function clearPackTimers(){ packTimers.forEach(clearTimeout); packTimers = []; }
var PACK_GLOW = { Common:'g-c', Uncommon:'g-uc', Rare:'g-r', Epic:'g-e', Legendary:'g-l', Unique:'g-u' };
var FAN_SLOTS = [ {x:-520,y:40,rot:-28}, {x:-260,y:6,rot:-14}, {x:0,y:0,rot:0}, {x:260,y:6,rot:14}, {x:520,y:40,rot:28} ];

function packCardEl(c, entry) {
  var dp = entry.deckPath;
  var isPrebuilt = c.renderMode === 'prebuilt';
  var isNF       = c.renderMode === 'nightfarer';
  var imgBase    = dp + '/' + entry.edition + '/' + pad3(c.cardId) + (c.imageSuffix || '');
  var rcls       = RARITY_CLASS[c.rarity] || 'rarity-c';
  var el = document.createElement('div');
  el.className = 'pack-card';
  el.innerHTML =
    '<div class="pack-flip">' +
      '<div class="pface"><div class="card ' + (isPrebuilt ? 'prebuilt' : rcls) + (c.isHolo ? ' holo' : '') + '" style="width:100%;height:100%">' +
        '<img class="' + (isNF ? 'boss-img' : 'bg-img') + '" src="' + imgBase + '.jpg" onerror="this.style.display=\'none\'">' +
        (isPrebuilt ? '' :
          '<img class="card-frame" src="' + dp + '/' + entry.cardBackFront + '">' +
          '<img class="rt" src="' + (RARITY_TOKEN[c.rarity] || RARITY_TOKEN['Common']) + '">' +
          '<div class="card-name">'   + c.displayName + '</div>' +
          '<div class="card-header">' + c.category + (c.region ? ' — ' + c.region : '') + '</div>' +
          '<div class="card-desc">'   + capDesc(c.description) + '</div>' +
          '<div class="card-num">#'   + pad3(c.cardId) + '</div>') +
      '</div></div>' +
      '<div class="pface pback"><img src="' + dp + '/' + entry.cardBackBack + '" style="width:100%;height:100%;object-fit:fill;"></div>' +
    '</div>';
  return el;
}

async function renderPack(entry) {
  clearPackTimers(); timers.forEach(clearTimeout); timers = [];
  var stage = document.getElementById('packStage');
  var plabel = document.getElementById('packLabel');
  var user  = document.getElementById('cardUsername');
  stage.innerHTML = ''; stage.style.transform = 'scale(1)';
  plabel.style.opacity = '0';

  await ensureFonts(entry.deckPath, entry.headerFont, entry.descFont);

  var cards = entry.batchCards || [];
  if (!cards.length) return;
  var vertical = document.body.classList.contains('vertical');
  var FAN_SCALE = vertical ? 0.52 : 0.8;   // bound the rotated fan corners inside the canvas
  // The fan scale is baked into each CARD's own transform (not the parent #packStage) so the
  // simultaneous 3D flip renders on each card's own full-res layer and the GPU just downscales it —
  // no ancestor 2D-scale flattening the preserve-3d subtree to a blurry cached texture.
  document.documentElement.style.setProperty('--fan-scale', FAN_SCALE);   // for the toss keyframe
  document.documentElement.style.setProperty('--pack-label-y', (vertical ? 330 : 420) + 'px');

  // rarest glow under the stack (rarest = LAST in flip order = bottom)
  var rarest = cards[cards.length - 1];
  var glow = document.createElement('div');
  glow.className = 'pack-glow ' + (PACK_GLOW[rarest.rarity] || 'g-c');
  stage.appendChild(glow);

  // build stack: top card (first pull) sits at center, each deeper card peeks down-right
  var els = cards.map(function(c, i){
    var el = packCardEl(c, entry);
    el.style.zIndex = 55 - i;                 // i=0 on top
    el.style.transform = 'translate(' + (i*6) + 'px,' + (i*8) + 'px)';
    stage.appendChild(el);
    return el;
  });

  // shrink long names/headers so nothing ever clips at any size (mirror the single-card fit)
  function fitNode(el, minPx) {
    if (!el) return;
    var size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth && size > minPx) { size -= 0.5; el.style.fontSize = size.toFixed(1) + 'px'; }
  }
  els.forEach(function (el) {
    fitNode(el.querySelector('.card-name'), 14);
    fitNode(el.querySelector('.card-header'), 14);
    fitNodeHeight(el.querySelector('.card-desc'), '--desc-size', '--desc-min');
  });

  // persisting username (binder line updates per flip)
  user.style.transition = 'opacity 0.5s ease';

  var t = 100;
  packTimers.push(setTimeout(function(){
    els.forEach(function(el){ el.style.opacity = '1'; });
    glow.classList.add('on');
    user.style.opacity = '1';
    fitUserBinder(entry.userDisplay, '', null);
  }, t));
  t += 250;   // get the ball rolling — first flip almost immediately

  // pull → flip → 1.5s hold → SLIDE off canvas right (no spin), one by one (rarest last)
  els.forEach(function(el, i){
    var c = cards[i];
    var isLast = (i === cards.length - 1);
    packTimers.push(setTimeout(function(){
      el.querySelector('.pack-flip').classList.add('show-front');
      var binderStr = (c.rarity || '') + ' - ' + (c.userCardCount != null ? c.userCardCount : '?') + '/' + (entry.deckTotal != null ? entry.deckTotal : '?');
      fitUserBinder(entry.userDisplay, binderStr, c.userCardCount);
      var bs = document.getElementById('cardBinderText');
      bs.style.transition='opacity 0.6s ease'; bs.style.opacity='1';
      bs.classList.remove('count-pop'); void bs.offsetWidth; bs.classList.add('count-pop');
    }, t));
    t += 700 + 1500;   // flip + 1.5s hold
    packTimers.push(setTimeout(function(){
      el.style.transform = 'translate(1500px,' + (i*8) + 'px)';
      if (isLast) glow.classList.remove('on');   // the rarest leaves — kill the stack glow
    }, t));
    t += 750;
  });

  // all 5 slide back into a left→right fan, BACKS UP — z by pull order (rarest on top, right)
  packTimers.push(setTimeout(function(){
    // stage stays at scale(1) — FAN_SCALE is folded into each card below (crisp flip, no parent-scale blur)
    els.forEach(function(el, i){
      var s = FAN_SLOTS[i];
      el.style.transition = 'none';
      el.querySelector('.pack-flip').classList.remove('show-front');     // back up
      var fq = el.querySelector('.pack-flip'); fq.style.transition = 'none';
      el.style.transform = 'translate(1600px,' + s.y + 'px) rotateZ(' + s.rot + 'deg)';   // off-screen start (full size)
      el.style.zIndex = 50 + i;                                          // z stacks by pull order
      void el.offsetWidth;
      el.style.transition = ''; fq.style.transition = '';
      packTimers.push(setTimeout(function(){
        // slide in AND shrink to the fan slot together — scale on the card, not the stage
        el.style.transform = 'translate(' + (s.x * FAN_SCALE) + 'px,' + (s.y * FAN_SCALE) + 'px) scale(' + FAN_SCALE + ') rotateZ(' + s.rot + 'deg)';
      }, 60 + i * 110));
    });
  }, t));
  t += 1500;

  // simultaneous flip — full fan reveal (no glow; it returns under the rarest for the exit)
  packTimers.push(setTimeout(function(){
    els.forEach(function(el){ el.querySelector('.pack-flip').classList.add('show-front'); });
    plabel.style.opacity = '1';
  }, t));
  t += 700 + 4000;   // flip + read-all hold

  // random exit: toss / fade / slide left|right|up|down — glow rides under the rarest as it goes
  packTimers.push(setTimeout(function(){
    glow.style.transform = 'translate(' + (FAN_SLOTS[els.length - 1].x * FAN_SCALE) + 'px,' + (FAN_SLOTS[els.length - 1].y * FAN_SCALE) + 'px) scale(' + FAN_SCALE + ')';
    glow.classList.add('on');
    packTimers.push(setTimeout(function(){ glow.classList.remove('on'); }, 700));
    plabel.style.opacity = '0';
    user.style.opacity = '0';
    var modes = ['toss', 'fade', 'left', 'right', 'up', 'down'];
    var mode = modes[Math.floor(Math.random() * modes.length)];
    var off = { left:'translate(-2400px,0)', right:'translate(2400px,0)', up:'translate(0,-2400px)', down:'translate(0,2400px)' };
    els.forEach(function(el, i){
      packTimers.push(setTimeout(function(){
        if (mode === 'toss') el.classList.add('toss');
        else if (mode === 'fade') el.style.opacity = '0';
        else {
          var s = FAN_SLOTS[i];
          el.style.transition = 'transform 0.8s ease-in, opacity 0.8s ease';
          el.style.transform = off[mode] + ' scale(' + FAN_SCALE + ') rotateZ(' + s.rot + 'deg)';
        }
      }, i * 90));
    });
  }, t));
  t += 1300;

  packTimers.push(setTimeout(function(){ stage.innerHTML = ''; }, t));
}

function poll() {
  fetch(STATE_URL)
    .then(function(r){ return r.json(); })
    .then(function(res){
      var state = res.state || res;
      if (!state.active || !state.current) return;
      var e = state.current;
      if (e.queueId !== lastQueueId) {
        lastQueueId = e.queueId;
        if (e.isBatch && e.batchCards) renderPack(e);
        else renderCard(e);
      }
    })
    .catch(function(){});
}

setInterval(poll, POLL_MS);
poll();
</script>
<script>
  (function(){
    var sid=null;
    setInterval(function(){
      fetch('/health',{cache:'no-store'})
        .then(function(r){return r.json();})
        .then(function(d){
          if(!sid){sid=d.sessionId;return;}
          if(d.sessionId&&d.sessionId!==sid){
            sessionStorage.removeItem('cards_reloaded_for');
            location.reload();
          }
        })
        .catch(function(){});
    },5000);
  })();
</script>
<script>
/* OBS-proof: scale the fixed design canvas to the REAL viewport (e.g. a 608x1080 source) */
(function(){
  function fitViewport(){
    var dw = parseInt(getComputedStyle(document.body).width, 10) || 1920;
    var dh = parseInt(getComputedStyle(document.body).height, 10) || 1080;
    var s = Math.min(window.innerWidth / dw, window.innerHeight / dh);
    if (Math.abs(s - 1) < 0.005) { document.body.style.transform = ''; return; }
    document.body.style.transformOrigin = 'top left';
    document.body.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fitViewport);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fitViewport);
  fitViewport();
  setTimeout(fitViewport, 300);   // re-fit after platform class lands
})();
</script>
