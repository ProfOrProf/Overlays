<!DOCTYPE html>
<meta charset="utf-8">
<title>Scoundrel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@600;800;900&display=swap');

  :root{
    --ink:#f3ece0;
    --dim:#b9ad99;
    --faint:#7d7364;
    --gold:#f0b13c;
    --blood:#d24a41;
    --steel:#a7b1c0;
    --heal:#63c982;
    --danger:#f0563d;
    --glow:0 0 4px rgba(0,0,0,.98), 0 2px 7px rgba(0,0,0,.95), 0 0 20px rgba(0,0,0,.75);
    --band:516px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);position:relative}
  body.plate{background:
    linear-gradient(115deg,#232a1c 0%,#3a3526 38%,#1b2029 70%,#0e1116 100%)}
  body.plate::before{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(58deg,rgba(255,255,255,.05) 0 3px,transparent 3px 26px)}

  .hud{position:absolute;left:0;right:0;bottom:0;height:var(--band);
    display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:0 44px 22px}

  .fuse{height:5px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden;
    box-shadow:0 1px 5px rgba(0,0,0,.9)}
  .fuse i{display:block;height:100%;width:100%;border-radius:99px;
    background:linear-gradient(90deg,#8a5f16,var(--gold));transition:width .25s linear}
  .fuse.hot i{background:linear-gradient(90deg,#7d2318,var(--danger))}

  .row{display:flex;align-items:flex-end;gap:30px}

  .dial{width:210px;flex:none;text-align:center}
  .dial .cap{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);
    text-shadow:var(--glow)}
  .hp{font-family:Cinzel,serif;font-size:92px;line-height:.92;
    text-shadow:0 0 5px rgba(0,0,0,.98),0 3px 10px rgba(0,0,0,.95),0 0 34px rgba(210,74,65,.75)}
  .hp small{font-family:Inter,sans-serif;font-size:26px;font-weight:800;color:var(--faint)}
  .pips{display:flex;gap:3px;justify-content:center;margin-top:8px}
  .pips i{width:9px;height:18px;border-radius:2px;background:rgba(255,255,255,.16);
    box-shadow:0 1px 4px rgba(0,0,0,.9)}
  .pips i.on{background:linear-gradient(180deg,#e06a5c,#a32f27)}
  .dial .sub{margin-top:9px;font-size:15px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);text-shadow:var(--glow)}
  .dial .sub b{color:var(--danger);font-weight:900;font-size:19px}

  .fanwrap{flex:1;position:relative;height:300px;margin-bottom:8px}
  .fan{position:absolute;left:50%;bottom:6px;width:0;height:0}
  .slot{position:absolute;width:172px;height:250px;left:0;bottom:0;margin-left:-86px;
    transform-origin:50% 130%;transition:transform .5s cubic-bezier(.2,.8,.25,1),opacity .4s ease}
  .flip{position:absolute;inset:0;transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.3,.9,.3,1)}
  .slot.up .flip{transform:rotateY(0deg)}
  .slot.down .flip{transform:rotateY(180deg)}
  .side{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;
    box-shadow:0 16px 34px rgba(0,0,0,.75), 0 0 0 2px rgba(0,0,0,.55)}
  .front{background:linear-gradient(168deg,#1d1813,#0d0b0a);
    border:2px solid rgba(200,165,95,.45);display:flex;flex-direction:column}
  .back{transform:rotateY(180deg);
    background:repeating-linear-gradient(45deg,#2a1d12 0 9px,#1a120b 9px 18px);
    border:2px solid rgba(200,165,95,.4)}

  .glyph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .rk{font-family:Cinzel,serif;font-size:66px;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  .st{font-size:34px;line-height:1}
  .mon .rk,.mon .st{color:var(--steel)}
  .wep .rk,.wep .st{color:var(--gold)}
  .pot .rk,.pot .st{color:var(--blood)}

  .cost{padding:7px 5px 9px;text-align:center;border-top:2px solid;
    font-weight:900;letter-spacing:.02em}
  .mon .cost{border-color:rgba(167,177,192,.45);background:rgba(167,177,192,.1)}
  .wep .cost{border-color:rgba(240,177,60,.45);background:rgba(240,177,60,.1)}
  .pot .cost{border-color:rgba(210,74,65,.45);background:rgba(210,74,65,.1)}
  .cost .big{font-size:25px;line-height:1.05}
  .cost .lil{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
    margin-top:4px;font-weight:800;line-height:1.25}
  .bad{color:var(--danger)} .good{color:var(--heal)} .warn{color:var(--gold)} .off{color:var(--faint)}

  .key{position:absolute;top:-19px;left:50%;transform:translateX(-50%);z-index:4;
    width:30px;height:30px;border-radius:8px;background:#0c0a08;border:2px solid rgba(200,165,95,.5);
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;
    color:var(--gold);box-shadow:0 3px 9px rgba(0,0,0,.8)}
  .slot.lead .front{border-color:var(--gold);box-shadow:0 0 26px rgba(240,177,60,.5)}
  .slot.gone{opacity:0}

  .blade{width:224px;flex:none;text-align:center;position:relative}
  .pile{position:relative;height:196px;margin-top:6px}
  .pile .pc{position:absolute;left:50%;bottom:0;width:88px;height:120px;margin-left:-44px;
    border-radius:9px;border:2px solid rgba(167,177,192,.45);background:linear-gradient(168deg,#1a1c20,#0d0e11);
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;
    color:var(--steel);box-shadow:0 8px 18px rgba(0,0,0,.7);transition:transform .5s ease}
  .pile .pc{z-index:1}
  .pile .pc.w{z-index:2;border-color:rgba(240,177,60,.7);color:var(--gold);
    background:linear-gradient(168deg,#241c0e,#100c07);font-family:Cinzel,serif;font-size:38px}
  .bind{margin-top:10px;font-size:16px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;
    color:var(--gold);text-shadow:var(--glow)}
  .bind.dead{color:var(--danger)}

  .pills{display:flex;gap:14px}
  .pill{position:relative;flex:1;overflow:hidden;border-radius:999px;height:62px;
    background:rgba(14,12,11,.72);border:2px solid rgba(255,255,255,.16);
    box-shadow:0 4px 16px rgba(0,0,0,.7), inset 0 -6px 14px rgba(0,0,0,.35);
    display:flex;align-items:center}
  .pill .fill{position:absolute;left:0;top:0;bottom:0;width:0;z-index:0;
    background:linear-gradient(90deg,rgba(122,90,30,.85),rgba(240,177,60,.55));
    transition:width .45s cubic-bezier(.3,.9,.3,1)}
  .pill .lbl{position:relative;z-index:1;display:flex;align-items:center;gap:12px;
    width:100%;padding:0 20px}
  .pill .k{width:34px;height:34px;flex:none;border-radius:8px;background:rgba(0,0,0,.6);
    border:2px solid rgba(240,177,60,.6);color:var(--gold);display:flex;align-items:center;
    justify-content:center;font-weight:900;font-size:16px}
  .pill .txt{font-size:17px;font-weight:800;letter-spacing:.05em;text-shadow:var(--glow);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill .n{margin-left:auto;font-size:24px;font-weight:900;color:var(--gold);text-shadow:var(--glow)}
  .pill.lead{border-color:var(--gold);box-shadow:0 0 22px 4px rgba(240,177,60,.45),0 4px 16px rgba(0,0,0,.7)}
  .pill.risk .fill{background:linear-gradient(90deg,rgba(125,35,24,.85),rgba(240,86,61,.5))}
  .pill.risk{border-color:rgba(240,86,61,.5)} .pill.risk .n{color:var(--danger)}
  .pill.risk .k{border-color:rgba(240,86,61,.6);color:var(--danger)}

  .ask{display:flex;align-items:baseline;gap:16px;padding:0 4px}
  .ask h1{font-family:Cinzel,serif;font-size:27px;letter-spacing:.09em;font-weight:700;
    text-shadow:var(--glow)}
  .ask .hint{font-size:15px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);
    font-weight:800;text-shadow:var(--glow)}
  .ask .clock{margin-left:auto;font-size:27px;font-weight:900;color:var(--gold);text-shadow:var(--glow)}

  .ticker{height:30px;overflow:hidden;display:flex;align-items:center;gap:14px;padding:0 4px}
  .ticker .tag{flex:none;font-size:12px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;
    color:var(--faint);text-shadow:var(--glow)}
  .marquee{overflow:hidden;flex:1}
  .marquee>span{display:inline-block;white-space:nowrap;will-change:transform;
    font-size:16px;letter-spacing:.06em;color:var(--dim);text-shadow:var(--glow);font-weight:600}
  .marquee.roll>span{animation:roll var(--dur,26s) linear -.5s infinite alternate}
  @keyframes roll{from{transform:translateX(0)}to{transform:translateX(var(--shift,0px))}}
  .marquee em{font-style:normal;color:var(--gold);font-weight:800}
  .marquee s{text-decoration:none;color:var(--danger);font-weight:800}

  .crumbs{position:absolute;top:-34px;left:44px;display:flex;gap:22px;align-items:baseline}
  .crumbs .bd{font-family:Cinzel,serif;font-size:20px;letter-spacing:.34em;color:var(--gold);
    text-shadow:var(--glow)}
  .crumbs .c{font-size:14px;letter-spacing:.19em;text-transform:uppercase;color:var(--dim);
    text-shadow:var(--glow)}
  .crumbs .c b{color:var(--ink);font-weight:900;font-size:17px}
  .crumbs .lock{font-size:13px;font-weight:900;letter-spacing:.17em;text-transform:uppercase;
    padding:4px 12px;border-radius:99px;text-shadow:var(--glow)}
  .lock.open{color:var(--heal);border:1.5px solid rgba(99,201,130,.6);background:rgba(99,201,130,.12)}
  .lock.shut{color:var(--danger);border:1.5px solid rgba(240,86,61,.6);background:rgba(240,86,61,.12)}

  .pred{position:absolute;right:44px;top:-40px;display:flex;align-items:center;gap:12px;
    padding:7px 16px;border-radius:99px;background:rgba(14,12,11,.75);
    border:2px solid rgba(145,71,255,.65);box-shadow:0 4px 16px rgba(0,0,0,.7)}
  .pred .dot{width:9px;height:9px;border-radius:50%;background:#9147ff;
    box-shadow:0 0 12px #9147ff;animation:readyPulse 1.6s ease-in-out infinite}
  @keyframes readyPulse{0%,100%{opacity:1}50%{opacity:.35}}
  .pred .t{font-size:14px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;
    color:#c9a6ff;text-shadow:var(--glow)}
  .pred .v{font-size:15px;font-weight:900;color:var(--ink);text-shadow:var(--glow)}
</style>

<div class="hud">

  <div class="crumbs">
    <span class="bd">SCOUNDREL</span>
    <span class="c">Room <b>7</b></span>
    <span class="c">Deck <b>23</b></span>
    <span class="c">Avoided <b>2</b></span>
    <span class="lock shut" id="lock">Avoid spent</span>
  </div>

  <div class="pred">
    <span class="dot"></span>
    <span class="t">Prediction</span>
    <span class="v">Does the delve survive?</span>
  </div>

  <div class="row">
    <div class="dial">
      <div class="cap">Health</div>
      <div class="hp" id="hp">14<small>/20</small></div>
      <div class="pips" id="pips"></div>
      <div class="sub">Score now <b id="score">−96</b></div>
    </div>

    <div class="fanwrap"><div class="fan" id="fan"></div></div>

    <div class="blade">
      <div class="cap" style="font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);text-shadow:var(--glow)">Blade</div>
      <div class="pile" id="pile"></div>
      <div class="bind" id="bind">Strikes ≤ 9</div>
    </div>
  </div>

  <div class="ask">
    <h1 id="ask">Which card does the chat take?</h1>
    <span class="hint" id="hint">Just type 1–4 · no ! needed</span>
    <span class="clock" id="clock">0:14</span>
  </div>

  <div class="fuse" id="fuse"><i style="width:70%"></i></div>

  <div class="pills" id="pills"></div>

  <div class="ticker">
    <span class="tag">Delve log</span>
    <div class="marquee roll" id="mq"><span id="mqs"></span></div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
const PLATE = new URLSearchParams(location.search).has('plate');
if (PLATE) document.body.classList.add('plate');

const ROOM = [
  {k:'mon', rk:'K', st:'♠', big:'−13 HP', lil:'Blade cannot strike this', cls:'bad',  vote:'King — eat 13', n:31, risk:true},
  {k:'mon', rk:'9', st:'♣', big:'−1 HP',  lil:'With blade · binds to ≤8', cls:'warn', vote:'Nine — blade it for 1', n:88, lead:true},
  {k:'pot', rk:'7', st:'♥', big:'+6 HP',  lil:'1 wasted · caps at 20',    cls:'good', vote:'Potion — heal 6', n:54},
  {k:'wep', rk:'3', st:'♦', big:'Swap',   lil:'Forced · the 8 is lost',   cls:'off',  vote:'Swap blade — lose the 8', n:7}
];

const FAN = [{x:-273,r:-6},{x:-91,r:-2},{x:91,r:2},{x:273,r:6}];

function buildFan(){
  const fan = $('fan');
  fan.innerHTML = '';
  ROOM.forEach((c,i) => {
    const s = document.createElement('div');
    s.className = 'slot ' + c.k + (c.lead ? ' lead' : '') + ' down';
    s.style.transform = `translateX(${FAN[i].x}px) rotateZ(${FAN[i].r}deg) scale(1)`;
    s.innerHTML =
      `<div class="key">${i+1}</div>
       <div class="flip">
         <div class="side back"></div>
         <div class="side front">
           <div class="glyph"><div class="rk">${c.rk}</div><div class="st">${c.st}</div></div>
           <div class="cost"><div class="big ${c.cls}">${c.big}</div><div class="lil">${c.lil}</div></div>
         </div>
       </div>`;
    fan.appendChild(s);
    setTimeout(() => s.classList.replace('down','up'), 240 + i*130);
  });
}

function buildPips(hp,max){
  $('pips').innerHTML = Array.from({length:max},(_,i)=>
    `<i class="${i<hp?'on':''}"></i>`).join('');
}

function buildPile(){
  const stack = [{t:'8♦',w:true},{t:'10♣'}];
  $('pile').innerHTML = stack.map((c,i)=>
    `<div class="pc ${c.w?'w':''}" style="transform:translateY(${-i*52}px) translateX(${i*16}px) rotate(${(i-0.5)*9}deg)">${c.t}</div>`
  ).reverse().join('');
}

function buildPills(){
  const total = ROOM.reduce((a,c)=>a+c.n,0);
  $('pills').innerHTML = ROOM.map((c,i)=>
    `<div class="pill ${c.lead?'lead':''} ${c.risk?'risk':''}">
       <div class="fill" style="width:${Math.round(c.n/total*100)}%"></div>
       <div class="lbl"><span class="k">${i+1}</span>
         <span class="txt">${c.vote}</span><span class="n">${c.n}</span></div>
     </div>`).join('');
}

function buildTicker(){
  const events = [
    'Room 6 — chat took <em>10♣</em>, bladed it for <s>−2 HP</s>, blade binds to ≤9',
    'Room 6 — <em>6♥</em> drunk, +6 HP',
    'Room 5 — chat chose <em>avoid</em>, four cards to the bottom',
    'Room 4 — <em>Q♠</em> eaten barehanded, <s>−12 HP</s>',
    'Room 4 — equipped <em>8♦</em>, discarded 4♦',
    'Room 3 — <em>A♣</em> eaten barehanded, <s>−14 HP</s>'
  ];
  const text = events.join('  ·  ') + '  ·  ';
  const span = $('mqs');
  span.innerHTML = text + text;
  requestAnimationFrame(() => {
    const over = span.scrollWidth/2;
    const box = $('mq').clientWidth;
    if (over > box){
      $('mq').style.setProperty('--shift', -(over - box + 40) + 'px');
      $('mq').style.setProperty('--dur', Math.round(over/38) + 's');
    } else $('mq').classList.remove('roll');
  });
}

let left = 14;
function tick(){
  left -= 1;
  if (left < 0) left = 20;
  $('clock').textContent = '0:' + String(left).padStart(2,'0');
  const pct = Math.max(0, Math.min(100, left/20*100));
  $('fuse').firstElementChild.style.width = pct + '%';
  $('fuse').classList.toggle('hot', left <= 5);
}

buildFan(); buildPips(14,20); buildPile(); buildPills(); buildTicker();
setInterval(tick, 1000);
</script>
