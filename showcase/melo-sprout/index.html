<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sprout Goal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="widget.css">
<style>html,body{background:transparent!important}</style>
<script src="demo_data.js"></script>
<script>
  window.demoState = { amount: 0 };
  const realFetch = window.fetch;
  window.fetch = function (url) {
    if (String(url).endsWith('goal')) {
      const body = JSON.stringify({ amount: window.demoState.amount, total: window.SPROUT_DEMO_FIELDS.progressGoal, revision: 0, fieldData: window.SPROUT_DEMO_FIELDS });
      return Promise.resolve(new Response(body, { status: 200, headers: { 'Content-Type': 'application/json' } }));
    }
    return realFetch.apply(window, arguments);
  };
</script>
<script src="host.js"></script>
<script src="jquery.min.js"></script>
<script src="lib.js"></script>
</head>
<body>
<main></main>
<script src="widget.js"></script>
<script>
  const goal = window.SPROUT_DEMO_FIELDS.progressGoal;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  (async () => {
    await wait(3000);
    for (;;) {
      while (window.demoState.amount < goal) {
        window.demoState.amount += 1;
        await wait(2500);
      }
      await wait(10000);
      window.demoState.amount = 0;
      await wait(3000);
    }
  })();
</script>
</body>
</html>
