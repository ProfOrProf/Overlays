<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>TwitchCon Fundraiser</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Goal: $3,000 for TwitchCon Weekend!!"/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://proforprof.com/twitchconfundraiser/"/>
<meta property="og:title" content="TwitchCon Fundraiser"/>
<meta property="og:description" content="Goal: $3,000 for TwitchCon Weekend!!"/>
<meta name="theme-color" content="#070606"/>
<link rel="canonical" href="https://proforprof.com/twitchconfundraiser/"/>
<style>
  :root{
    --ink:#efe6d6; --ink-dim:#b3a68f; --ink-faint:#6f665a; --grace:#f0b13c;
    --panel:#0c0a09; --line:rgba(179,144,80,.22);
    --serif:"Palatino Linotype",Palatino,"Book Antiqua","Iowan Old Style",Georgia,serif;
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  html,body{margin:0;min-height:100%;background:#070606;color:var(--ink);font-family:var(--serif);font-weight:400}
  ::selection{background:rgba(240,177,60,.25)}
  main{max-width:640px;margin:0 auto;padding:clamp(40px,8vh,90px) 16px 90px}
  h1{font-weight:400;font-size:clamp(22px,4.4vw,34px);letter-spacing:.06em;line-height:1.3;margin:0;color:var(--grace);text-align:center}
  .raised{margin:14px 0 0;text-align:center;font-size:15px;letter-spacing:.12em;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .give{display:block;width:max-content;max-width:100%;margin:28px auto 8px;padding:13px 26px;border:1px solid var(--grace);border-radius:2px;
    color:var(--grace);text-decoration:none;font-size:13px;letter-spacing:.34em;text-transform:uppercase;transition:letter-spacing .25s,box-shadow .25s}
  .give:hover,.give:focus-visible{letter-spacing:.42em;box-shadow:0 0 30px rgba(240,177,60,.35);outline:none}
  .kofi{text-align:center;font-size:12px;letter-spacing:.08em;color:var(--ink-faint);margin:0 0 30px}
  .kofi a{color:inherit}
  h2{font-weight:400;font-variant:small-caps;text-transform:lowercase;text-decoration:underline;text-decoration-color:rgba(240,177,60,.6);text-underline-offset:5px;
    font-size:21px;letter-spacing:.12em;color:var(--ink);margin:40px 0 12px}
  ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto 1fr;gap:9px 12px}
  li{display:contents;font-size:16px;letter-spacing:.04em;line-height:1.45;color:var(--ink-dim)}
  li span{font-size:16px;letter-spacing:.04em;line-height:1.45;color:var(--ink-dim)}
  li b{font-size:16px;letter-spacing:.04em;line-height:1.45}
  li.done b,li.done span{opacity:.55}
  li b{font-weight:400;color:var(--grace);font-variant-numeric:tabular-nums;white-space:nowrap}
  li.done{opacity:.55}
  .quiet{font-style:italic;color:var(--ink-faint);font-size:14px;letter-spacing:.06em}
</style>
</head>
<body>
<main>
  <h1>Goal: $3,000 for TwitchCon Weekend!!</h1>
  <p class="raised" id="raised"></p>
  <a class="give" id="give" href="https://ko-fi.com/prof">Ko-fi</a>
  <p class="kofi"><a id="kofi" href="https://ko-fi.com/prof">ko-fi.com/prof</a></p>
  <div id="menu"><p class="quiet">Loading</p></div>
</main>
<script>
const FUND = "https://proffund.fly.dev";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: Number.isInteger(Number(n)) ? 0 : 2, maximumFractionDigits: 2 });

function section(title, rows) {
  if (!rows.length) return "";
  return `<h2>${esc(title)}</h2><ul>${rows.map(r => `<li class="${r.done ? "done" : ""}"><b>${esc(r.price)}</b><span>- ${esc(r.item)}</span></li>`).join("")}</ul>`;
}

async function load() {
  const [s, g] = await Promise.all([
    fetch(FUND + "/api/state").then(r => r.json()),
    fetch(FUND + "/api/giveaway/state").then(r => r.json()).catch(() => null)
  ]);
  document.getElementById("raised").textContent = money(s.total) + " raised";
  if (s.kofiUrl) {
    document.getElementById("give").href = s.kofiUrl;
    const k = document.getElementById("kofi");
    k.href = s.kofiUrl;
    k.textContent = s.kofiUrl.replace(/^https?:\/\//, "");
  }
  let html = "";
  html += section("Effects", (s.effectMenu || []).map(m => ({ price: money(m.dollars), item: m.label + (m.note ? " (" + m.note + ")" : "") })));
  html += section("Subs", [{ price: "1 sub", item: "Wheel of Chaos" }]);
  html += section("Donor Rewards", (s.rewards || []).map(r => ({ price: money(r.min) + "+", item: r.label })));
  const goals = [...(s.milestones || []), ...(s.stretch || [])].sort((a, b) => a.at - b.at);
  html += section("Goals", goals.map(m => ({ price: money(m.at), item: m.label, done: m.reached })));
  if (s.bidwar && s.bidwar.open) html += section("Bid War: " + s.bidwar.title, s.bidwar.sides.map(x => ({ price: money(x.total), item: x.name })));
  if (g && g.donorPrizes && g.donorPrizes.length) html += section("Donor Only Giveaway", g.donorPrizes.map(p => ({ price: "Donors", item: p })));
  if (g && g.prizes && g.prizes.length) html += section("Free Giveaway", g.prizes.map(p => ({ price: g.donorOnly ? money(g.donorOnly) + "+" : "Free", item: p })));
  document.getElementById("menu").innerHTML = html;
}

load().catch(() => { document.getElementById("menu").innerHTML = ""; });
setInterval(() => load().catch(() => {}), 60000);
</script>
</body>
</html>
