<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>God Run 3</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;background:#141414}
body{overflow-x:hidden}
.wrap{position:relative;width:100vw;aspect-ratio:1920 / 620;overflow:hidden}
.wrap iframe{position:absolute;left:0;top:0;width:1920px;height:620px;border:0;transform-origin:0 0;background:transparent}
</style>
</head>
<body>
<div class="wrap"><iframe src="overlay.html?only=splits&amp;demo&amp;poll=0" scrolling="no" allowtransparency="true"></iframe></div>
<div class="wrap"><iframe src="overlay.html?only=splits&amp;demo&amp;poll=0&amp;single" scrolling="no" allowtransparency="true"></iframe></div>
<script>
(function(){
  var frames=document.querySelectorAll('.wrap iframe');
  function fit(){
    frames.forEach(function(f){ f.style.transform='scale('+(f.parentNode.clientWidth/1920)+')'; });
  }
  window.addEventListener('resize',fit); fit();
})();
</script>
</body>
</html>
